<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PowerHub</title>
<style>
  :root{
    --primary:#0f766e;
    --primary-dark:#0b544e;
    --primary-light:#ccfbf1;
    --bg:#f4f6f7;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
    --danger:#dc2626;
    --danger-light:#fee2e2;
    --warn:#d97706;
    --warn-light:#fef3c7;
    --ok:#16a34a;
    --ok-light:#dcfce7;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}

  #save-warning{display:none;align-items:center;gap:14px;background:var(--danger);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;position:sticky;top:0;z-index:200;}
  #save-warning.warn{background:var(--warn);}
  #save-warning.warn .btn.small{color:var(--warn);}
  .storage-meter{height:10px;background:var(--border);border-radius:999px;overflow:hidden;margin:8px 0 6px;}
  .storage-meter > div{height:100%;background:var(--ok);border-radius:999px;}
  .storage-meter.warn > div{background:var(--warn);}
  .storage-meter.danger > div{background:var(--danger);}
  #save-warning-text{flex:1;}
  #save-warning .btn.small{background:#fff;color:var(--danger);}
  #save-warning .btn.small:hover{background:#f1f5f9;}

  #notes-reminder{display:none;align-items:center;gap:14px;background:var(--primary);color:#fff;padding:10px 20px;font-size:14px;font-weight:600;}
  #notes-reminder-text{flex:1;}
  #notes-reminder .btn.small{background:#fff;color:var(--primary);}
  #notes-reminder .btn.small:hover{background:#f1f5f9;}

  /* Sidebar */
  #sidebar{width:220px;background:var(--primary-dark);color:#fff;display:flex;flex-direction:column;padding:20px 0;flex-shrink:0;}
  #sidebar h1{font-size:18px;padding:0 20px 20px;margin:0;border-bottom:1px solid rgba(255,255,255,.15);}
  #sidebar nav{display:flex;flex-direction:column;margin-top:10px;}
  #sidebar button{background:none;border:none;color:#e2e8f0;text-align:left;padding:14px 20px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:10px;}
  #sidebar button:hover{background:rgba(255,255,255,.08);}
  #sidebar button.active{background:var(--primary);color:#fff;font-weight:600;}

  #content{flex:1;padding:24px 28px;max-width:1200px;}
  h2.page-title{margin:0 0 20px;font-size:24px;}

  .card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px;}
  .stat{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .stat .num{font-size:28px;font-weight:700;color:var(--primary);}
  .stat .label{color:var(--muted);font-size:13px;margin-top:4px;}

  button.btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;}
  button.btn:hover{background:var(--primary-dark);}
  button.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--primary);}
  button.btn.secondary:hover{background:var(--primary-light);}
  button.btn.danger{background:var(--danger);}
  button.btn.danger:hover{background:#b91c1c;}
  button.btn.small{padding:6px 10px;font-size:13px;}
  button.icon-btn{background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted);padding:4px 8px;}
  button.icon-btn:hover{color:var(--danger);}

  table{width:100%;border-collapse:collapse;}
  table th, table td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);font-size:14px;}
  table th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  table tr:hover td{background:#fafafa;}
  table tr.month-group-row td{background:var(--primary-light);color:var(--primary-dark);font-weight:700;border-bottom:none;}
  table tr.month-group-row:hover td{background:var(--primary-light);}
  table td.indent{padding-left:24px;}

  .table-scroll{max-height:420px;overflow-y:auto;}
  .table-scroll table thead th{position:sticky;top:0;background:var(--card);}

  .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;}
  .badge.ok{background:var(--ok-light);color:var(--ok);}
  .badge.warn{background:var(--warn-light);color:var(--warn);}
  .badge.danger{background:var(--danger-light);color:var(--danger);}
  .badge.muted{background:#f1f5f9;color:var(--muted);}
  .badge.cat-weights{background:#dbeafe;color:#1d4ed8;}
  .badge.cat-pilates{background:#fae8ff;color:#a21caf;}

  .cat-filter{display:flex;gap:8px;margin-bottom:14px;}

  input, select, textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);}

  .autocomplete{position:relative;}
  .autocomplete-list{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:4px;max-height:160px;overflow-y:auto;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.12);display:none;}
  .autocomplete-list.open{display:block;}
  .autocomplete-item{padding:8px 10px;font-size:14px;cursor:pointer;}
  .autocomplete-item:hover,.autocomplete-item.active{background:var(--primary-light);}
  .autocomplete-empty{padding:8px 10px;font-size:13px;color:var(--muted);}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px;}
  label:first-child{margin-top:0;}
  .form-row{display:flex;gap:12px;}
  .form-row > div{flex:1;}

  /* Native date inputs display in the browser/OS locale format (often MM/DD/YYYY),
     not the page's language, so we overlay our own DD/MM/YYYY label on top while
     keeping the real native input (and its calendar picker) fully functional underneath. */
  .date-field{position:relative;}
  .date-field input[type="date"]{position:absolute;inset:0;opacity:0;margin:0;padding:0;border:0;cursor:pointer;}
  .date-field-overlay{padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:14px;color:var(--text);display:flex;align-items:center;gap:6px;pointer-events:none;}
  .date-field-overlay.placeholder{color:var(--muted);}
  .date-field-overlay .cal-icon{margin-left:auto;opacity:.55;font-size:13px;}
  .date-field input[type="date"]:focus + .date-field-overlay{outline:2px solid var(--primary);outline-offset:1px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
  .search{max-width:280px;}

  .empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:14px;}

  /* Modal */
  #modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  #modal-overlay.open{display:flex;}
  #modal-box{background:#fff;border-radius:var(--radius);padding:22px 24px;max-width:460px;width:100%;max-height:88vh;overflow-y:auto;}
  #modal-box h3{margin:0 0 14px;font-size:18px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

  .active-toggle{display:flex;align-items:center;gap:10px;margin-top:10px;}
  .active-toggle .switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0;}
  .active-toggle .switch input{opacity:0;width:0;height:0;}
  .active-toggle .switch .slider{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.15s;}
  .active-toggle .switch .slider::before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3);}
  .active-toggle .switch input:checked + .slider{background:var(--ok);}
  .active-toggle .switch input:checked + .slider::before{transform:translateX(18px);}
  .active-toggle .switch-label{font-size:14px;font-weight:600;}

  /* Weekly schedule */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .day-col h4{margin:0 0 8px;font-size:14px;text-align:center;color:var(--primary-dark);}
  .day-col{background:var(--card);border-radius:var(--radius);padding:10px;min-height:120px;}
  .slot{background:var(--primary-light);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:13px;}
  .slot:hover{background:#a7f3ea;}
  .slot .t{font-weight:700;}
  .slot .c{color:var(--muted);font-size:12px;}
  .add-slot-btn{width:100%;background:none;border:1px dashed var(--border);border-radius:8px;padding:8px;color:var(--muted);cursor:pointer;font-size:13px;}
  .add-slot-btn:hover{background:#f1f5f9;}

  .enrolled-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px;}

  .roster-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;}
  .roster-row:last-child{border-bottom:none;}
  .note-chip{font-size:12px;color:var(--muted);background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:3px 8px;margin-top:3px;max-width:280px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .note-chip:hover{border-color:var(--primary);color:var(--text);}

  /* Weekly notes page */
  .scope-seg{display:flex;gap:10px;flex-wrap:wrap;}
  .scope-option{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px;color:var(--text);margin:0;padding:9px 14px;border:1px solid var(--border);border-radius:8px;cursor:pointer;background:#fff;flex:1;min-width:200px;transition:border-color .15s,background .15s;}
  .scope-option:hover{border-color:var(--primary);}
  .scope-option input{width:auto;margin:0;accent-color:var(--primary);}
  .scope-option.checked{border-color:var(--primary);background:var(--primary-light);}
  .note-entry{background:#fafbfc;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:border-color .15s;}
  .note-entry:last-child{margin-bottom:0;}
  .note-entry:hover{border-color:var(--primary);}
  .note-entry.reviewed{background:transparent;}
  .note-card.week-current{border-left:4px solid var(--primary);}
  .status-seg{display:flex;gap:4px;flex-wrap:wrap;}
  .status-seg button{padding:5px 9px;font-size:12px;border:1px solid var(--border);background:#fff;color:var(--muted);border-radius:6px;cursor:pointer;white-space:nowrap;}
  .status-seg button:hover{border-color:var(--primary);}
  .status-seg button.sel-ok{background:var(--ok-light);color:var(--ok);border-color:var(--ok);font-weight:600;}
  .status-seg button.sel-warn{background:var(--warn-light);color:var(--warn);border-color:var(--warn);font-weight:600;}
  .status-seg button.sel-danger{background:var(--danger-light);color:var(--danger);border-color:var(--danger);font-weight:600;}

  /* Attendance calendar */
  .cal-compact{display:flex;align-items:center;gap:10px;}
  .cal-compact-label{font-weight:700;font-size:14px;cursor:pointer;flex:1;}
  .cal-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .cal-month-label{font-weight:700;font-size:14px;flex:1;text-align:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:420px;margin:0 auto;}
  .cal-dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding-bottom:2px;}
  .cal-cell{border-radius:6px;background:#f8fafc;border:1px solid var(--border);cursor:pointer;padding:3px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;height:34px;gap:1px;}
  .cal-cell:hover{border-color:var(--primary);}
  .cal-cell.cal-empty{background:none;border:none;cursor:default;}
  .cal-daynum{font-size:12px;font-weight:600;}
  .cal-count{font-size:9px;font-weight:700;color:var(--primary);background:var(--primary-light);border-radius:5px;padding:0 4px;}
  .cal-cell.cal-today{border-color:var(--primary);border-width:2px;}
  .cal-cell.cal-selected{background:var(--primary);border-color:var(--primary);}
  .cal-cell.cal-selected .cal-daynum{color:#fff;}
  .cal-cell.cal-selected .cal-count{background:rgba(255,255,255,.25);color:#fff;}
  .cal-cell.cal-has-att:not(.cal-selected){background:var(--primary-light);}

  .subtle{color:var(--muted);font-size:13px;}
  .section-title{font-size:15px;font-weight:700;margin:22px 0 10px;}
  .section-title:first-child{margin-top:0;}

  @media (max-width:900px){
    #app{flex-direction:column;}
    #sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:8px;}
    #sidebar h1{display:none;}
    #sidebar nav{flex-direction:row;margin-top:0;}
    #sidebar button{padding:10px 14px;white-space:nowrap;}
    .week-grid{grid-template-columns:1fr;}
    #content{padding:16px;}
    .form-row{flex-direction:column;gap:0;}
  }
</style>
</head>
<body>
<div id="save-warning">
  <span id="save-warning-text"></span>
  <button class="btn small" onclick="exportData()">⬇ Λήψη Αντιγράφου Τώρα</button>
  <button class="icon-btn" style="color:#fff;" onclick="dismissSaveWarning()">✕</button>
</div>
<div id="notes-reminder">
  <span id="notes-reminder-text"></span>
  <button class="btn small" onclick="navigate('notes'); dismissNotesReminder();">Προβολή Σημειώσεων</button>
  <button class="icon-btn" style="color:#fff;" onclick="dismissNotesReminder()">✕</button>
</div>
<div id="app">
  <div id="sidebar">
    <h1>🏋️ PowerHub</h1>
    <nav id="nav"></nav>
  </div>
  <div id="content"></div>
</div>

<div id="modal-overlay">
  <div id="modal-box"></div>
</div>

<script>
/* ---------------- Data layer ---------------- */
const STORAGE_KEY = 'gymAppData';
/* Internal day codes stay in English (Mon..Sun) so stored data keeps working;
   only the on-screen labels are translated via DAY_FULL / DAY_SHORT below. */
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAY_FULL = {Mon:'Δευτέρα',Tue:'Τρίτη',Wed:'Τετάρτη',Thu:'Πέμπτη',Fri:'Παρασκευή',Sat:'Σάββατο',Sun:'Κυριακή'};
const DAY_SHORT = {Mon:'Δευ',Tue:'Τρι',Wed:'Τετ',Thu:'Πεμ',Fri:'Παρ',Sat:'Σαβ',Sun:'Κυρ'};
/* Declared up here (not next to categoryBadge) because normalizeData() needs
   it while the very first loadData() runs, before the rest of the script. */
const CLASS_CATEGORIES = ['Βάρη', 'Πιλάτες'];

function defaultData(){ return { members: [], schedule: [], attendance: [], payments: [], notes: [], reviewedNotes: [], employees: [], scheduleOverrides: [] }; }

/* Ids are only ever interpolated into inline onclick="...('${id}')" handlers,
   so they must never contain quotes or angle brackets. Ids we generate (uid())
   are always [a-z0-9], but a hand-edited or malicious backup file could smuggle
   arbitrary strings in — strip anything outside a safe charset. Applied
   consistently to ids AND the fields that reference them, so references
   between records survive the cleanup intact. */
function sanitizeId(v){ return String(v == null ? '' : v).replace(/[^\w-]/g, ''); }

/* Coerces anything parsed from localStorage or an imported backup into the
   exact shape the app expects. A backup with e.g. members:"hello" used to pass
   the old typeof check, get SAVED, and then crash every render until the user
   cleared browser storage — so shape-validate before the data ever replaces
   the live state. */
function normalizeData(parsed){
  const d = defaultData();
  if(!parsed || typeof parsed !== 'object') return d;
  Object.keys(d).forEach(key => {
    if(Array.isArray(parsed[key])){
      d[key] = parsed[key].filter(x => key === 'reviewedNotes' ? typeof x === 'string' : (x && typeof x === 'object'));
    }
  });
  const validTime = t => /^\d{2}:\d{2}$/.test(String(t));
  /* Format AND calendar validity: "2026-02-31" matches the pattern but is
     not a date, and would render as NaN/NaN/NaN everywhere it appears. */
  const validDate = d => /^\d{4}-\d{2}-\d{2}$/.test(String(d)) && localDateStr(new Date(d + 'T00:00:00')) === d;
  const validCategory = c => CLASS_CATEGORIES.includes(c);
  const asStr = v => typeof v === 'string' ? v : (v == null ? '' : String(v));
  d.members.forEach(m => {
    m.id = sanitizeId(m.id);
    /* Free-text fields are escaped at render time, but they must at least BE
       strings — a backup with e.g. name:{} crashed every page that sorts or
       searches members. Dates end up inside HTML attributes, so anything not
       strictly YYYY-MM-DD from a tampered backup is discarded, not rendered. */
    m.name = asStr(m.name); m.phone = asStr(m.phone); m.email = asStr(m.email); m.notes = asStr(m.notes);
    if(m.joinDate != null && !validDate(m.joinDate)) m.joinDate = '';
    /* Generic reusable checkmark — not tied to any specific purpose (handing
       out flyers, calling members back, etc). The user ticks it for whatever
       they're currently tracking and clears all of them (clearAllMemberFlags)
       once that round is done, then reuses it for the next occasion. */
    m.flagged = m.flagged === true;
  });
  /* colorIndex drives each employee's schedule color (see employeeHue()).
     Employees saved before that feature existed (or a hand-edited backup)
     have no colorIndex — assign one from load order so every employee gets
     a stable, well-separated color starting from their very first render,
     without ever reassigning an index an employee already has. */
  let nextColorIndex = d.employees.reduce((max, e) => Number.isInteger(e.colorIndex) ? Math.max(max, e.colorIndex + 1) : max, 0);
  d.employees.forEach(e => {
    e.id = sanitizeId(e.id);
    e.name = asStr(e.name);
    if(e.category != null && !validCategory(e.category)) delete e.category;
    if(!Number.isInteger(e.colorIndex)) e.colorIndex = nextColorIndex++;
  });
  /* Times are interpolated into HTML unescaped (they normally come from
     <input type="time">), so anything not strictly HH:MM from a tampered
     backup is discarded here rather than reaching the DOM. */
  /* A series whose weekday isn't one of Mon..Sun can never occur on any
     date, and its day code would render as "undefined" — drop it. */
  d.schedule = d.schedule.filter(s => DAYS.includes(s.day));
  d.schedule.forEach(s => {
    s.id = sanitizeId(s.id);
    s.className = asStr(s.className); s.comments = asStr(s.comments);
    if(!validCategory(s.category)) s.category = CLASS_CATEGORIES[0];
    s.memberIds = Array.isArray(s.memberIds) ? s.memberIds.map(sanitizeId) : [];
    s.capacity = Math.max(1, parseInt(s.capacity) || 1);
    if(!validTime(s.startTime)) s.startTime = '09:00';
    if(!validTime(s.endTime)) s.endTime = '10:00';
    /* A series applies to every occurrence of its weekday with no lower/upper
       bound unless narrowed — '' sorts before every real YYYY-MM-DD string,
       so treating a missing/invalid validFrom as '' means "always has
       applied" (matches how every schedule slot behaved before per-date
       splitting existed) without needing a sentinel date. */
    s.validFrom = validDate(s.validFrom) ? s.validFrom : '';
    s.validUntil = validDate(s.validUntil) ? s.validUntil : null;
  });
  /* Overrides are optional patches onto one specific (seriesId, date)
     occurrence — see occurrenceForSeriesOnDate(). Any field left out (or
     invalid) simply falls back to the series' own value for that field, so
     a corrupted override never blanks out a class, just loses that one edit. */
  d.scheduleOverrides = d.scheduleOverrides.filter(o => validDate(o.date));
  d.scheduleOverrides.forEach(o => {
    o.id = sanitizeId(o.id);
    o.seriesId = sanitizeId(o.seriesId);
    o.cancelled = o.cancelled === true;
    if(o.startTime != null && !validTime(o.startTime)) delete o.startTime;
    if(o.endTime != null && !validTime(o.endTime)) delete o.endTime;
    if(o.capacity != null) o.capacity = Math.max(1, parseInt(o.capacity) || 1);
    if(o.className != null) o.className = asStr(o.className);
    if(o.comments != null) o.comments = asStr(o.comments);
    if(o.category != null && !validCategory(o.category)) delete o.category;
    /* Per-date membership deltas: members added to / removed from just this
       one occurrence (see applyMembershipChange()). Same id hygiene as every
       other id list. */
    ['addMemberIds','removeMemberIds'].forEach(k => {
      if(o[k] != null){
        if(Array.isArray(o[k])) o[k] = o[k].map(sanitizeId);
        else delete o[k];
      }
    });
  });
  /* Every attendance/payment/note is dated, and those dates feed .slice()
     and HTML directly — a record with a missing or malformed date crashed
     whole pages after an import (and importData saves before rendering, so
     the app stayed broken on every reload). Undated records are dropped. */
  d.attendance = d.attendance.filter(a => validDate(a.date));
  d.attendance.forEach(a => {
    a.id = sanitizeId(a.id);
    a.memberId = sanitizeId(a.memberId);
    if(a.slotId != null) a.slotId = sanitizeId(a.slotId);
    if(a.note != null) a.note = asStr(a.note);
    /* STATUS_META is indexed by status when rendering, so an unknown value
       crashed the member card. Unknown -> the same default recordStatus()
       applies to a missing status. */
    if(a.status != null && !['present','justified','unjustified'].includes(a.status)) delete a.status;
    if(a.category != null && !validCategory(a.category)) delete a.category;
  });
  d.payments = d.payments.filter(p => validDate(p.date));
  d.payments.forEach(p => {
    p.id = sanitizeId(p.id);
    p.memberId = sanitizeId(p.memberId);
    p.method = asStr(p.method); p.note = asStr(p.note);
    /* The payment form enforces positive numbers; a backup must too, or a
       negative amount/classes silently corrupts balances and revenue totals. */
    p.amount = Math.max(0, Number(p.amount) || 0);
    p.classes = Math.max(0, parseInt(p.classes) || 0);
    if(p.category != null && !validCategory(p.category)) delete p.category;
  });
  d.notes = d.notes.filter(n => validDate(n.date));
  d.notes.forEach(n => {
    n.id = sanitizeId(n.id);
    n.text = asStr(n.text);
    n.weekKey = validDate(n.weekKey) ? n.weekKey : mondayOf(n.date);
    /* A recurring note has no fixed end — it's shown in its origin week and
       every week after (see notesForWeek()). Notes saved before this feature
       existed have no `recurring` field; treated as false (one-time, tied
       only to their weekKey) so nothing changes for existing data. */
    n.recurring = n.recurring === true;
    /* Optional tags linking a note to a specific member and/or class series —
       purely informational (no balances or attendance depend on them), so a
       stale reference (the member/class was later deleted) is left as-is and
       just resolved to a "(deleted)" label at render time instead of being
       stripped out here. */
    if(n.memberId != null) n.memberId = sanitizeId(n.memberId);
    if(n.classId != null) n.classId = sanitizeId(n.classId);
  });
  /* Each entry is "<noteId>__<weekKey>" — one note's reviewed checkmark for
     one specific week it appeared in (a recurring note gets a separate
     checkmark per week, since "read" this week doesn't mean "read" next
     week too). Same id-hygiene as every other id-bearing field. */
  d.reviewedNotes = d.reviewedNotes.map(sanitizeId);
  return d;
}

/* Size of the last snapshot written to localStorage — see storageUsage().
   Declared before loadData() runs, which records the loaded size. */
let lastSavedChars = 0;
/* When the snapshot in localStorage was written (ms since epoch) — compared
   against the IndexedDB copy's stamp on load, see initDurableStore(). */
const SAVED_AT_KEY = 'gymAppSavedAt';
let lastSavedAt = 0;
function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultData();
    lastSavedChars = raw.length;
    lastSavedAt = Number(localStorage.getItem(SAVED_AT_KEY)) || 0;
    return normalizeData(JSON.parse(raw));
  }catch(e){
    return defaultData();
  }
}

let data = loadData();

/* ---------------- Durable store (IndexedDB) ---------------- */
/* localStorage is synchronous and instant, but capped at ~5 MB — a busy gym
   fills that in roughly a year of attendance, after which setItem() throws
   and nothing more would be saved. IndexedDB has a far larger budget (a share
   of the disk), so every snapshot is ALSO written there, stamped with the
   save time. On load, localStorage is read synchronously for an instant
   first paint, then the IndexedDB copy is checked: if it is newer (the
   localStorage write failed for lack of room, or browser storage was
   partially cleared) it wins and the page re-renders. All IndexedDB work is
   chained on one promise so a read never races a later write. */
const DATA_DB = 'gymAppSnapshots';
const hasIDB = typeof indexedDB !== 'undefined';
let dbChain = Promise.resolve();
function openDataDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DATA_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('snapshots');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGetSnapshot(){
  const db = await openDataDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('snapshots', 'readonly');
    const req = tx.objectStore('snapshots').get('current');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
    tx.oncomplete = () => db.close();
  });
}
async function idbPutSnapshot(record){
  const db = await openDataDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('snapshots', 'readwrite');
    tx.objectStore('snapshots').put(record, 'current');
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}
function saveToDurableStore(json, savedAt){
  if(!hasIDB) return Promise.resolve();
  dbChain = dbChain
    .then(() => idbPutSnapshot({ json, savedAt }))
    .then(() => { saveIssues.durable = null; })
    .catch(e => {
      console.warn('IndexedDB save failed:', e);
      saveIssues.durable = "⚠️ Η αποθήκευση στη βάση δεδομένων του browser απέτυχε. Κατεβάστε αντίγραφο ασφαλείας τώρα (καρτέλα Αντίγραφο Ασφαλείας).";
    })
    .then(updateSaveWarning);
  return dbChain;
}
function initDurableStore(){
  if(!hasIDB) return Promise.resolve();
  /* Ask the browser not to evict this site's storage under disk pressure. */
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); }catch(e){}
  dbChain = dbChain.then(idbGetSnapshot).then(rec => {
    if(rec && typeof rec.json === 'string' && Number(rec.savedAt) > lastSavedAt){
      data = normalizeData(JSON.parse(rec.json));
      lastSavedAt = Number(rec.savedAt);
      lastSavedChars = rec.json.length;
      invalidateDerived();
      render();
    } else if(!rec && lastSavedChars > 0){
      /* First run after this feature shipped: seed the durable copy. */
      return idbPutSnapshot({ json: JSON.stringify(data), savedAt: lastSavedAt || Date.now() });
    }
  }).catch(e => { console.warn('IndexedDB load failed:', e); });
  return dbChain;
}

/* ---------------- Derived-data cache ---------------- */
/* Rendering recomputes per-member balances and package ledgers many times per
   page (the payments table used to rebuild a member's ENTIRE ledger once per
   payment row, which made typing in the payment search lag by whole seconds
   once a couple of years of data piled up). Everything derived is memoized
   here and thrown away on any data change — saveData() runs after every
   mutation, so invalidating there keeps the cache always-correct. */
let derivedCache = null;
function derived(){
  if(!derivedCache){
    const payByMember = {}, attByMember = {};
    data.payments.forEach(p => (payByMember[p.memberId] = payByMember[p.memberId] || []).push(p));
    data.attendance.forEach(a => (attByMember[a.memberId] = attByMember[a.memberId] || []).push(a));
    derivedCache = { payByMember, attByMember, ledgers: {}, reviewedSet: new Set(data.reviewedNotes) };
  }
  return derivedCache;
}
function invalidateDerived(){ derivedCache = null; }
/* How many classes each employee has actually taught: one session
   (a specific series+date) counts only if at least one member was marked
   PRESENT in it — a class with nobody showing up isn't "done". A single pass
   over attendance groups records into sessions, then each qualifying session
   is attributed to whichever employee's name that occurrence's class carried
   ON THAT DATE (resolved through any per-date schedule override, so a
   one-off substitute teacher is credited correctly instead of the regular
   series owner). Memoized on the same cache as everything else derived from
   data — thrown away by invalidateDerived() on every save. */
function employeeClassTally(){
  const cache = derived();
  if(cache.employeeTally) return cache.employeeTally;
  const sessions = {};
  data.attendance.forEach(a => {
    const key = a.slotId + '|' + a.date;
    if(!sessions[key]) sessions[key] = { slotId: a.slotId, date: a.date, hasPresent: false };
    if(isPresentRecord(a)) sessions[key].hasPresent = true;
  });
  const tally = {};
  Object.values(sessions).forEach(s => {
    if(!s.hasPresent) return;
    const series = data.schedule.find(x => x.id === s.slotId);
    if(!series) return;
    const occ = occurrenceForSeriesOnDate(series, s.date);
    /* A cancelled occurrence never ran, whatever attendance may linger on it. */
    if(!occ) return;
    const className = occ.className;
    if(!tally[className]) tally[className] = { total: 0, byMonth: {} };
    tally[className].total++;
    const month = s.date.slice(0,7);
    tally[className].byMonth[month] = (tally[className].byMonth[month] || 0) + 1;
  });
  cache.employeeTally = tally;
  return tally;
}

/* ---------------- Live file-save (File System Access API) ---------------- */
/* Only Chromium browsers (Chrome/Edge/Opera/Brave) support writing straight to
   a file on disk without a download prompt. Safari/Firefox have no equivalent
   API, so on those browsers we just keep the instant localStorage save and
   tell the person to use manual backups instead. */
const hasFSAccess = 'showSaveFilePicker' in window;
let fileHandle = null;
let fileHandleStatus = 'none'; // 'none' | 'connected' | 'needs-permission'

/* Tracks why the save banner is showing, if at all. Storage issues take
   priority over file-write issues since losing localStorage is the bigger risk. */
const saveIssues = { storage: null, space: null, file: null, durable: null };
function updateSaveWarning(){
  const banner = document.getElementById('save-warning');
  /* Red = the last change may not be safe anywhere. Amber = heads-up only:
     localStorage is full/nearly full but the IndexedDB copy still saves. */
  const hard = saveIssues.durable || (!hasIDB && saveIssues.storage) || saveIssues.file;
  const soft = (hasIDB && saveIssues.storage && !dismissedStorageFull) ||
               (saveIssues.space && dismissedSpaceStep !== storageUsage().step);
  const msg = hard || soft;
  if(msg){
    document.getElementById('save-warning-text').textContent = msg;
    banner.classList.toggle('warn', !hard);
    banner.style.display = 'flex';
  } else {
    banner.style.display = 'none';
  }
}
let dismissedSpaceStep = null;
let dismissedStorageFull = false;
function dismissSaveWarning(){
  document.getElementById('save-warning').style.display = 'none';
  const hard = saveIssues.durable || (!hasIDB && saveIssues.storage) || saveIssues.file;
  if(hard) return;
  if(hasIDB && saveIssues.storage) dismissedStorageFull = true;
  else if(saveIssues.space) dismissedSpaceStep = storageUsage().step;
}

/* ---- Browser storage capacity ---- */
/* localStorage gives every site a fixed budget (about 5 MB) and when it's
   full setItem() throws and nothing more is saved. There is no API to ask
   how much room is left, and browsers count differently: Chrome counts
   UTF-16 units (~5.2 M characters), Safari counts bytes and stores any
   string containing a non-Latin character — i.e. every snapshot of this app,
   since the data is Greek — at 2 bytes per character (~2.6 M characters).
   So the ceiling is measured once, in THIS browser, with a Greek probe
   string (binary search on the largest string that still fits), cached, and
   usage is then tracked as the size of the last saved snapshot against it. */
const STORAGE_LIMIT_KEY = 'gymAppStorageLimit';
const STORAGE_WARN_RATIO = 0.75;
let storageLimitChars = 2500000; // conservative default until probed
function probeStorageLimit(){
  try{
    const cached = parseInt(localStorage.getItem(STORAGE_LIMIT_KEY));
    if(cached > 0){ storageLimitChars = cached; return; }
    const used = (localStorage.getItem(STORAGE_KEY) || '').length;
    let lo = 0, hi = 12000000;
    while(hi - lo > 20000){
      const mid = (lo + hi) >> 1;
      try{ localStorage.setItem('gymAppProbe', 'α'.repeat(mid)); lo = mid; }
      catch(e){ hi = mid; }
    }
    localStorage.removeItem('gymAppProbe');
    if(lo > 0){ storageLimitChars = used + lo; localStorage.setItem(STORAGE_LIMIT_KEY, String(storageLimitChars)); }
  }catch(e){ try{ localStorage.removeItem('gymAppProbe'); }catch(_){} }
}
function storageUsage(){
  const pct = Math.min(100, Math.round(lastSavedChars / storageLimitChars * 100));
  /* Shown in MB of the stored form (2 bytes per character), so the number
     matches what the browser's own storage settings report. */
  return { chars: lastSavedChars, mb: (lastSavedChars * 2 / 1048576).toFixed(2), limitMb: (storageLimitChars * 2 / 1048576).toFixed(0), pct, step: Math.floor(pct / 5),
           level: pct >= 90 ? 'danger' : pct >= STORAGE_WARN_RATIO * 100 ? 'warn' : 'ok' };
}
function checkStorageSpace(){
  const u = storageUsage();
  saveIssues.space = u.level === 'ok' ? null : hasIDB
    ? `⚠️ Ο γρήγορος χώρος αποθήκευσης του browser είναι σχεδόν γεμάτος (${u.pct}% — ${u.mb} MB από περίπου ${u.limitMb} MB). Η εφαρμογή θα συνεχίσει να αποθηκεύει στη βάση δεδομένων του browser, αλλά κατεβάστε ένα αντίγραφο ασφαλείας (καρτέλα Αντίγραφο Ασφαλείας).`
    : `⚠️ Ο αποθηκευτικός χώρος του browser είναι σχεδόν γεμάτος (${u.pct}% — ${u.mb} MB από περίπου ${u.limitMb} MB). Όταν γεμίσει, οι νέες αλλαγές ΔΕΝ θα αποθηκεύονται. Κατεβάστε αντίγραφο ασφαλείας τώρα (καρτέλα Αντίγραφο Ασφαλείας).`;
}

function saveData(){
  invalidateDerived();
  const json = JSON.stringify(data);
  /* Strictly increasing even for two saves in the same millisecond, so the
     durable copy's stamp always orders correctly against localStorage's. */
  lastSavedAt = Math.max(Date.now(), lastSavedAt + 1);
  lastSavedChars = json.length;
  try{
    localStorage.setItem(STORAGE_KEY, json);
    localStorage.setItem(SAVED_AT_KEY, String(lastSavedAt));
    saveIssues.storage = null;
  }catch(e){
    console.warn('localStorage save failed:', e);
    saveIssues.storage = hasIDB
      ? "⚠️ Ο γρήγορος χώρος αποθήκευσης του browser γέμισε. Οι αλλαγές σας εξακολουθούν να αποθηκεύονται στη βάση δεδομένων του browser, αλλά κατεβάστε ένα αντίγραφο ασφαλείας για σιγουριά (καρτέλα Αντίγραφο Ασφαλείας)."
      : "⚠️ Η τελευταία σας αλλαγή ΔΕΝ αποθηκεύτηκε — ο χώρος αποθήκευσης του browser είναι γεμάτος. Κατεβάστε αντίγραφο ασφαλείας τώρα και μετά ελευθερώστε χώρο ή συνδέστε ένα αρχείο ζωντανής αποθήκευσης (καρτέλα Αντίγραφο Ασφαλείας).";
  }
  saveToDurableStore(json, lastSavedAt);
  checkStorageSpace();
  updateSaveWarning();
  if(hasFSAccess && fileHandle && fileHandleStatus === 'connected'){
    writeToFile();
  }
}

/* Writes are chained: createWritable() only commits on close(), and two
   saves in quick succession could otherwise finish out of order, leaving the
   OLDER snapshot as the file's final content. The chain never rejects —
   errors are caught (and surfaced via the banner) inside doWriteToFile. */
let writeChain = Promise.resolve();
function writeToFile(){
  writeChain = writeChain.then(doWriteToFile);
  return writeChain;
}
async function doWriteToFile(){
  try{
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(data, null, 2));
    await writable.close();
    saveIssues.file = null;
  }catch(e){
    console.warn('Live file save failed:', e);
    saveIssues.file = "⚠️ Η ζωντανή αποθήκευση στο αρχείο σας απέτυχε. Τα δεδομένα σας εξακολουθούν να είναι αποθηκευμένα σε αυτόν τον browser — μεταβείτε στο Αντίγραφο Ασφαλείας για να επανασυνδέσετε το αρχείο.";
  }
  updateSaveWarning();
}

const HANDLE_DB = 'gymAppFileHandle';
function openHandleDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function storeHandle(handle){
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(handle, 'file');
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function getStoredHandle(){
  const db = await openHandleDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readonly');
    const req = tx.objectStore('handles').get('file');
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
async function clearStoredHandle(){
  const db = await openHandleDB();
  return new Promise((resolve) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').delete('file');
    tx.oncomplete = () => resolve();
  });
}

async function initFileHandle(){
  if(!hasFSAccess) return;
  try{
    const stored = await getStoredHandle();
    if(!stored) return;
    fileHandle = stored;
    const perm = await stored.queryPermission({mode:'readwrite'});
    fileHandleStatus = perm === 'granted' ? 'connected' : 'needs-permission';
    render();
  }catch(e){ /* no stored handle, ignore */ }
}

async function connectFile(){
  try{
    const handle = await window.showSaveFilePicker({
      suggestedName: 'gym-data.json',
      types: [{ description: 'JSON File', accept: {'application/json': ['.json']} }],
    });
    fileHandle = handle;
    fileHandleStatus = 'connected';
    await storeHandle(handle);
    await writeToFile();
    render();
  }catch(e){
    if(e.name !== 'AbortError') alert('Δεν ήταν δυνατή η σύνδεση με αυτό το αρχείο.');
  }
}
async function reconnectFile(){
  if(!fileHandle) return;
  try{
    const perm = await fileHandle.requestPermission({mode:'readwrite'});
    if(perm === 'granted'){
      fileHandleStatus = 'connected';
      await writeToFile();
    } else {
      alert('Δεν δόθηκε άδεια, οπότε η ζωντανή αποθήκευση παραμένει σε παύση.');
    }
  }catch(e){
    alert('Δεν ήταν δυνατή η επανασύνδεση με το αρχείο. Δοκιμάστε ξανά «Σύνδεση Αρχείου Αποθήκευσης».');
  }
  render();
}
async function disconnectFile(){
  fileHandle = null;
  fileHandleStatus = 'none';
  await clearStoredHandle();
  render();
}

/* Monotonic counter guarantees uniqueness even when many ids are generated
   within the same millisecond (bulk imports, sample data). */
let uidCounter = 0;
function uid(){ return Date.now().toString(36) + (uidCounter++).toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- Date helpers ---------------- */
function todayStr(){
  /* Must use the LOCAL calendar date, not toISOString() (which is UTC) —
     Greece is UTC+2/+3, so for a few hours after local midnight, UTC would
     still report the previous day, showing yesterday's schedule as "today". */
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function formatDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  const day = String(dt.getDate()).padStart(2,'0');
  const month = String(dt.getMonth()+1).padStart(2,'0');
  return `${day}/${month}/${dt.getFullYear()}`;
}
function dayAbbrev(dateStr){
  const map = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return map[new Date(dateStr+'T00:00:00').getDay()];
}
/* Search/filter normalization for Greek text: case-folded, accents (tonos,
   dialytika) stripped, final sigma folded — so typing "μαρια" finds "Μαρία"
   and "κωστασ" finds "Κώστας". */
function searchKey(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ς/g, 'σ');
}
function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* Colors are assigned to employees sequentially (see `colorIndex` on the
   employee record, assigned in normalizeData()/saveEmployee()) using the
   golden-angle hue step. Unlike hashing a name to a hue, this GUARANTEES
   every employee's hue is ~137.5° from the ones assigned right before and
   after it, regardless of how many employees exist or how similar their
   names are — a hash can only make collisions unlikely, never impossible,
   and two employees with similar names (or just bad luck) would eventually
   land on near-identical hues again as more were added. */
function employeeHue(colorIndex){ return (Number(colorIndex || 0) * 137.508) % 360; }
function employeeColor(e){ return `hsl(${employeeHue(e.colorIndex)}, 62%, 38%)`; }
/* Schedule slots only store the class name as a plain string (see the
   Employees section below), so to color a slot we look up the employee that
   currently has that name. A name with no matching employee (the employee
   was renamed/deleted since, or this is legacy data from before employees
   existed) falls back to a hash-based hue — no sequencing guarantee, but
   there's no employee record to sequence it against either. */
function hashHue(str){
  let hash = 0;
  const s = String(str || '');
  for(let i=0; i<s.length; i++){ hash = (hash*31 + s.charCodeAt(i)) | 0; }
  let h = Math.imul(hash ^ (hash >>> 16), 2654435761) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 2246822519) >>> 0;
  return h % 360;
}
function classNameColor(className){
  const emp = data.employees.find(e => e.name === className);
  const hue = emp ? employeeHue(emp.colorIndex) : hashHue(className);
  return `hsl(${hue}, 62%, 38%)`;
}

function categoryBadge(cat){
  const c = cat || CLASS_CATEGORIES[0];
  const cls = c === 'Πιλάτες' ? 'cat-pilates' : 'cat-weights';
  return `<span class="badge ${cls}">${escapeHtml(c)}</span>`;
}

/* Native <input type="date"> always displays in the browser/OS locale format
   (e.g. MM/DD/YYYY on a US-English system) regardless of this page's language,
   so we overlay a DD/MM/YYYY label on top of the real, fully-functional native
   input. See syncDateOverlay() for the live update on change. */
function dateFieldHtml(id, value){
  const hasValue = !!value;
  const label = hasValue ? formatDate(value) : 'ΗΗ/ΜΜ/ΕΕΕΕ';
  return `<div class="date-field">
    <input type="date" id="${id}" value="${escapeHtml(value||'')}" oninput="syncDateOverlay(this)">
    <div class="date-field-overlay${hasValue?'':' placeholder'}" id="${id}-overlay"><span id="${id}-overlay-text">${label}</span><span class="cal-icon">📅</span></div>
  </div>`;
}
function syncDateOverlay(input){
  const overlay = document.getElementById(input.id + '-overlay');
  const label = document.getElementById(input.id + '-overlay-text');
  if(!overlay || !label) return;
  if(input.value){
    label.textContent = formatDate(input.value);
    overlay.classList.remove('placeholder');
  } else {
    label.textContent = 'ΗΗ/ΜΜ/ΕΕΕΕ';
    overlay.classList.add('placeholder');
  }
}

/* ---------------- Derived / computed helpers ---------------- */
function memberPayments(memberId){
  return (derived().payByMember[memberId] || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1);
}
function memberAttendance(memberId){
  return (derived().attByMember[memberId] || []).slice().sort((a,b)=> a.date < b.date ? 1 : -1);
}
/* Class credits are tracked per category (Βάρη / Πιλάτες), not as one
   shared pool: a payment buys N classes of a specific category, and only
   attendance in a class of that same category draws down that category's
   balance (see slotCategory() and setClassStatus()/markClassPresent()).
   Payments or attendance saved before categories existed have no category on
   them; they're treated as Βάρη so old data isn't silently discarded. */
function slotCategory(slotId){
  if(!slotId) return null;
  const s = data.schedule.find(x => x.id === slotId);
  return s ? (s.category || CLASS_CATEGORIES[0]) : null;
}
/* The category an attendance record consumes a credit in. New records get a
   category stamped on them at creation time, so a class being deleted or
   re-categorized later can never silently rewrite history (deleting a slot
   used to "refund" every credit ever consumed in it). Older records fall back
   to the live slot lookup, and records with neither (pre-category data, or a
   long-gone slot) count as Βάρη per the rule above — never dropped. */
function attendanceCategory(a){
  return a.category || slotCategory(a.slotId) || CLASS_CATEGORIES[0];
}

/* Every attendance record belongs to a booked class and carries one of three
   statuses. Records saved before this feature existed have no status field —
   they're treated as 'present' so nothing is silently lost or miscounted.
     present     -> they came; consumes a class credit
     justified   -> excused absence; spares a credit UNLESS it's the 2nd (4th,
                    6th, ...) justified absence in that category, which
                    consumes one — two justified absences together cost the
                    same as one unjustified no-show
     unjustified -> unexcused no-show; STILL consumes a class credit */
const STATUS_META = {
  present:     { label: 'Παρουσία',              short: '✓ Παρουσία',        cls: 'ok' },
  justified:   { label: 'Δικαιολογημένη Απουσία', short: 'Δικαιολ. Απουσία', cls: 'warn' },
  unjustified: { label: 'Αδικαιολόγητη Απουσία',  short: 'Αδικαιολ. Απουσία', cls: 'danger' },
};
function recordStatus(a){ return a.status || 'present'; }
function isPresentRecord(a){ return recordStatus(a) === 'present'; }
function attendanceRecordFor(memberId, date, slotId){
  return data.attendance.find(a => a.memberId === memberId && a.date === date && a.slotId === slotId);
}

/* Every 'present'/'unjustified' record consumes a credit outright; 'justified'
   ones only consume a credit every 2nd time (chronologically, oldest first),
   so two justified absences together cost one credit just like a single
   unjustified no-show. Shared by classesUsed() (a simple count) and
   memberPackageLedger() (which needs the same records to draw down packages
   in the same order), so the two never disagree on what "used" means. */
function consumingAttendanceRecords(memberId, category){
  const records = (derived().attByMember[memberId] || [])
    .filter(a => attendanceCategory(a) === category)
    .slice()
    .sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0));
  let justifiedSeen = 0;
  return records.filter(a => {
    if(recordStatus(a) !== 'justified') return true;
    justifiedSeen++;
    return justifiedSeen % 2 === 0;
  });
}
function classesPurchased(memberId, category){
  return (derived().payByMember[memberId] || [])
    .filter(p => (p.category || CLASS_CATEGORIES[0]) === category)
    .reduce((s,p)=> s + Number(p.classes || 0), 0);
}
function classesUsed(memberId, category){
  return consumingAttendanceRecords(memberId, category).length;
}
function classesRemaining(memberId, category){
  return classesPurchased(memberId, category) - classesUsed(memberId, category);
}
function memberStatus(memberId, category){
  const purchased = classesPurchased(memberId, category);
  if(purchased === 0){
    /* Someone who has attended but never paid owes classes — that is the most
       urgent "needs attention" case of all, not a neutral "no payment yet". */
    const used = classesUsed(memberId, category);
    if(used > 0) return {label: `Απλήρωτ${used===1?'ο':'α'} ${used} μάθημα${used===1?'':'τα'}`, cls:'danger'};
    return {label:'Καμία πληρωμή', cls:'muted'};
  }
  const remaining = classesRemaining(memberId, category);
  if(remaining < 0) return {label: `Εξαντλήθηκαν τα μαθήματα (${remaining})`, cls:'danger'};
  if(remaining === 0) return {label:'Εξαντλήθηκαν τα μαθήματα', cls:'danger'};
  if(remaining === 1) return {label:'1 μάθημα απομένει', cls:'warn'};
  if(remaining <= 2) return {label: remaining + ' μαθήματα απομένουν', cls:'warn'};
  return {label: remaining + ' μαθήματα απομένουν', cls:'ok'};
}

/* ---------------- Package ledger ---------------- */
/* Each payment is a "package" of N classes. Packages are drawn down oldest-
   first (FIFO) by actual attendance date, regardless of whether a specific
   visit happened before or after the payment that ends up covering it — this
   is what makes "attended day X, paid day X+1" and "paid in advance while an
   older package still has classes left" both work out correctly and visibly:
     - A visit with no package to draw from yet (or all packages so far
       exhausted) is a deficit until a later payment retroactively covers it —
       at that point the covering package's "active from" date becomes that
       earlier visit's date, even though it was paid afterward.
     - A package paid for while an older one still has classes left simply
       waits in the queue; it has no "active from" date until the older one
       actually runs out and it starts getting drawn on. We can't predict that
       calendar date in advance (it depends on how often the person actually
       shows up) — but once it happens, this recomputes it automatically. */
function memberPackageLedger(memberId, category){
  /* Memoized: the payments page asks for the same ledger once per payment row,
     and rebuilding it from scratch each time made big histories crawl. */
  const cache = derived();
  const cacheKey = memberId + '|' + category;
  if(cache.ledgers[cacheKey]) return cache.ledgers[cacheKey];

  const packages = (cache.payByMember[memberId] || [])
    .filter(p => (p.category || CLASS_CATEGORIES[0]) === category)
    .slice()
    .sort((a,b) => a.date < b.date ? -1 : (a.date > b.date ? 1 : 0))
    .map(p => ({ payment: p, total: Number(p.classes || 0), remaining: Number(p.classes || 0), firstUsedDate: null }));

  const events = consumingAttendanceRecords(memberId, category);

  let idx = 0;
  const assignments = [];
  events.forEach(ev => {
    while(idx < packages.length && packages[idx].remaining <= 0) idx++;
    if(idx < packages.length){
      packages[idx].remaining--;
      if(!packages[idx].firstUsedDate) packages[idx].firstUsedDate = ev.date;
      assignments.push({ event: ev, pkg: packages[idx].payment });
    } else {
      assignments.push({ event: ev, pkg: null }); // still uncovered by any known payment
    }
  });

  const ledger = { packages, assignments };
  cache.ledgers[cacheKey] = ledger;
  return ledger;
}
/* Returns { state:'active', date } | { state:'pending' } | { state:'unused' } for one payment. */
function paymentEffectiveInfo(payment){
  const cat = payment.category || CLASS_CATEGORIES[0];
  const { packages } = memberPackageLedger(payment.memberId, cat);
  const i = packages.findIndex(p => p.payment.id === payment.id);
  if(i === -1) return { state: 'unused' };
  const pk = packages[i];
  if(pk.firstUsedDate) return { state: 'active', date: pk.firstUsedDate, backdated: pk.firstUsedDate < payment.date };
  const pendingBehind = packages.slice(0, i).some(p => p.remaining > 0);
  return { state: pendingBehind ? 'pending' : 'unused' };
}
/* Members saved before the active/inactive feature existed have no `active`
   field — treated as active so nothing already in storage silently vanishes
   into the "inactive" bucket. Only an explicit `false` counts as inactive. */
function isActiveMember(m){ return m.active !== false; }
function toggleMemberActive(id){
  const m = data.members.find(x=>x.id===id);
  if(!m) return;
  m.active = !isActiveMember(m);
  saveData();
  render();
}
function toggleMemberFlag(id){
  const m = data.members.find(x=>x.id===id);
  if(!m) return;
  m.flagged = !m.flagged;
  saveData();
  render();
}
function clearAllMemberFlags(){
  if(!confirm('Απενεργοποίηση όλων των σημειωμένων μελών;')) return;
  data.members.forEach(m => m.flagged = false);
  saveData();
  render();
}
function memberName(id){
  const m = data.members.find(m => m.id === id);
  return m ? m.name : '(διαγραμμένο μέλος)';
}
function monthLabel(monthStr){
  const [y, m] = monthStr.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('el-GR', {month:'long', year:'numeric'});
}
/* Groups payments by the month they actually became valid/active (not the
   month they were paid in) — the real month of use, useful for seeing when
   revenue was actually "earned" rather than just when cash came in. Payments
   still pending (an older package hasn't run out yet) or paid-but-never-used
   have no valid month yet, so they're reported separately instead of guessed. */
function paymentsByValidMonth(){
  const groups = {};
  /* Two different reasons a payment isn't in the monthly table yet:
       pending -> blocked behind an older package that still has classes left
       unused  -> it IS the active package, nobody has attended from it yet */
  let pendingCount = 0, pendingAmount = 0;
  let unusedCount = 0, unusedAmount = 0;
  data.payments.forEach(p => {
    const cat = p.category || CLASS_CATEGORIES[0];
    const info = paymentEffectiveInfo(p);
    if(info.state === 'pending'){
      pendingCount++; pendingAmount += Number(p.amount);
      return;
    }
    if(info.state === 'unused'){
      unusedCount++; unusedAmount += Number(p.amount);
      return;
    }
    const month = info.date.slice(0,7);
    const key = month + '|' + cat;
    if(!groups[key]) groups[key] = { month, category: cat, count: 0, amount: 0, classes: 0 };
    groups[key].count++;
    groups[key].amount += Number(p.amount);
    groups[key].classes += Number(p.classes || 0);
  });
  const rows = Object.values(groups).sort((a,b) => b.month.localeCompare(a.month) || a.category.localeCompare(b.category));
  return { rows, pendingCount, pendingAmount, unusedCount, unusedAmount };
}
/* Groups payments by the month they were actually PAID in — straightforward
   cash-received-per-month, unlike paymentsByValidMonth() above which groups
   by when the package started being used instead. */
function paymentsByPayMonth(){
  const groups = {};
  data.payments.forEach(p => {
    const cat = p.category || CLASS_CATEGORIES[0];
    const month = p.date.slice(0,7);
    const key = month + '|' + cat;
    if(!groups[key]) groups[key] = { month, category: cat, count: 0, amount: 0, classes: 0 };
    groups[key].count++;
    groups[key].amount += Number(p.amount);
    groups[key].classes += Number(p.classes || 0);
  });
  return Object.values(groups).sort((a,b) => b.month.localeCompare(a.month) || a.category.localeCompare(b.category));
}
/* "Days attended" everywhere in the app means actual physical presence —
   absences (justified or not) are excluded from this, even though an
   unjustified one still costs a class credit. */
function memberPresentAttendance(memberId){
  return memberAttendance(memberId).filter(isPresentRecord);
}
function memberPresentAttendanceCount(memberId, category){
  return memberPresentAttendance(memberId).filter(a => attendanceCategory(a) === category).length;
}
/* Breaks a day's PRESENT attendance down by class category (absences don't
   count as "here today"). Every attendance record belongs to a booked class —
   there's no walk-in concept — but a record from data saved before categories
   existed (no slotId) is still counted in `total` so nothing goes missing. */
function attendanceCounts(date){
  const records = data.attendance.filter(a => a.date === date && isPresentRecord(a));
  const byCategory = {};
  CLASS_CATEGORIES.forEach(cat => byCategory[cat] = new Set());
  records.forEach(a => {
    const cat = attendanceCategory(a);
    if(byCategory[cat]) byCategory[cat].add(a.memberId);
  });
  const counts = {};
  CLASS_CATEGORIES.forEach(cat => counts[cat] = byCategory[cat].size);
  return { byCategory: counts, total: new Set(records.map(r=>r.memberId)).size };
}

/* ---------------- Navigation ---------------- */
const views = [
  {key:'dashboard', label:'📊 Πίνακας Ελέγχου'},
  {key:'members', label:'👥 Μέλη'},
  {key:'employees', label:'🧑‍💼 Υπάλληλοι'},
  {key:'schedule', label:'🗓️ Εβδομαδιαίο Πρόγραμμα'},
  {key:'attendance', label:'✅ Παρουσίες'},
  {key:'payments', label:'💳 Πληρωμές'},
  {key:'notes', label:'📝 Σημειώσεις'},
  {key:'backup', label:'💾 Αντίγραφο Ασφαλείας'},
];
let currentView = 'dashboard';
let lastRenderedView = null;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = views.map(v =>
    `<button class="${v.key===currentView?'active':''}" onclick="navigate('${v.key}')">${v.label}</button>`
  ).join('');
}
function navigate(view){
  currentView = view;
  render();
}
function render(){
  renderNav();
  const c = document.getElementById('content');

  /* Rebuilding #content via innerHTML (below) destroys and recreates every
     element in it — including whatever input the user is currently typing
     in, which silently drops focus and forces a re-click after every single
     keystroke in any live-search box. Save the focused element's identity
     and cursor position first, then restore it after the rebuild. */
  const active = document.activeElement;
  const hadFocus = active && c.contains(active) && active.id;
  const focusId = hadFocus ? active.id : null;
  const selStart = hadFocus && 'selectionStart' in active ? active.selectionStart : null;
  const selEnd = hadFocus && 'selectionStart' in active ? active.selectionEnd : null;

  /* Same problem as focus above: rebuilding #content also resets the page's
     scroll position and the scrollTop of every internal scrollable table
     (.table-scroll), so e.g. ticking a checkbox in a long payments table
     jumps the view back to the top. Scrollable tables have no stable id, but
     the same view always renders the same number of them in the same order,
     so positional matching before/after the rebuild is reliable. */
  /* ...but only when re-rendering the SAME view. Switching pages should
     land at the top, not at wherever the previous page was scrolled to. */
  const sameView = lastRenderedView === currentView;
  const winScroll = sameView ? window.scrollY : 0;
  const tableScrollTops = sameView ? Array.from(c.querySelectorAll('.table-scroll')).map(el => el.scrollTop) : [];
  lastRenderedView = currentView;

  if(currentView==='dashboard') c.innerHTML = renderDashboard();
  else if(currentView==='members') c.innerHTML = renderMembers();
  else if(currentView==='employees') c.innerHTML = renderEmployees();
  else if(currentView==='schedule') c.innerHTML = renderSchedule();
  else if(currentView==='attendance') c.innerHTML = renderAttendance();
  else if(currentView==='payments') c.innerHTML = renderPayments();
  else if(currentView==='notes') c.innerHTML = renderNotes();
  else if(currentView==='backup') c.innerHTML = renderBackup();
  checkNotesReminder();

  window.scrollTo(0, winScroll);
  c.querySelectorAll('.table-scroll').forEach((el, i) => { if(tableScrollTops[i] != null) el.scrollTop = tableScrollTops[i]; });

  if(focusId){
    const restored = document.getElementById(focusId);
    if(restored){
      restored.focus();
      if(selStart !== null && 'setSelectionRange' in restored){
        try{ restored.setSelectionRange(selStart, selEnd); }catch(e){ /* not a text-selectable input type */ }
      }
    }
  }
}

/* ---------------- Modal ---------------- */
function openModal(html){
  document.getElementById('modal-box').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal-box').innerHTML = '';
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if(e.target.id === 'modal-overlay') closeModal();
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  /* An open autocomplete list claims Escape for itself (see acKeydown, which
     stops propagation), so this only ever closes the modal. */
  if(document.getElementById('modal-overlay').classList.contains('open')) closeModal();
});

/* ---------------- Member autocomplete ---------------- */
/* A plain <select> gets unwieldy once a gym has more than a couple dozen
   members — no search box, just scrolling an alphabetical list. This is a
   small reusable text-autocomplete: a visible text input plus a hidden input
   holding the actual selected member id at the SAME id a <select> would have
   used, so every existing call site (document.getElementById(id).value)
   keeps working unchanged. Options for each field are kept in
   `autocompleteOptions`/`autocompleteMatches` keyed by field id. */
let autocompleteOptions = {};
let autocompleteMatches = {};
let autocompleteActiveIndex = {};
function memberAutocompleteHtml(id, members, selectedId, placeholder){
  const sorted = members.slice().sort((a,b)=>a.name.localeCompare(b.name,'el'));
  autocompleteOptions[id] = sorted.map(m => ({ id: m.id, name: m.name }));
  const selected = sorted.find(m => m.id === selectedId);
  return `
    <div class="autocomplete">
      <input type="text" id="${id}-input" autocomplete="off" placeholder="${escapeHtml(placeholder||'Αναζήτηση μέλους...')}" value="${escapeHtml(selected?.name||'')}"
        oninput="acFilter('${id}')" onfocus="acFilter('${id}')" onkeydown="acKeydown(event,'${id}')" onblur="acClose('${id}')">
      <input type="hidden" id="${id}" value="${selected ? selected.id : ''}">
      <div class="autocomplete-list" id="${id}-list"></div>
    </div>
  `;
}
function acFilter(id){
  const input = document.getElementById(id+'-input');
  const list = document.getElementById(id+'-list');
  if(!input || !list) return;
  const q = input.value.trim().toLowerCase();
  const options = autocompleteOptions[id] || [];
  /* The hidden id must never outlive the text it was chosen for: once the
     person edits the box so it no longer reads the selected member's name,
     drop the selection immediately. Otherwise a fast click on Save (which
     fires before acClose's blur timer) would submit the OLD member while the
     box visibly showed a different name. */
  const hidden = document.getElementById(id);
  if(hidden && hidden.value){
    const current = options.find(o => o.id === hidden.value);
    if(!current || current.name !== input.value) hidden.value = '';
  }
  const qk = searchKey(q);
  const matches = (qk ? options.filter(o=>searchKey(o.name).includes(qk)) : options).slice(0,5);
  autocompleteMatches[id] = matches;
  autocompleteActiveIndex[id] = -1;
  list.innerHTML = matches.length===0
    ? '<div class="autocomplete-empty">Δεν βρέθηκαν μέλη.</div>'
    : matches.map((m,i)=>`<div class="autocomplete-item" data-idx="${i}" onmousedown="acSelect('${id}','${m.id}')">${escapeHtml(m.name)}</div>`).join('');
  list.classList.add('open');
  /* The list is an absolutely-positioned child of #modal-box, which itself
     scrolls (overflow-y:auto) — a modal-box ancestor with overflow clips any
     absolutely-positioned descendant that extends past its own visible
     scroll area, so a dropdown opened near the bottom of a tall modal (e.g.
     the "add member" field in the class detail modal, below a long roster)
     could get cut off. Scrolling the input to the nearest edge of the modal
     first keeps the freshly-opened list inside the visible area. */
  input.scrollIntoView({block:'nearest'});
}
function acSelect(id, memberId){
  const opt = (autocompleteOptions[id]||[]).find(o=>o.id===memberId);
  if(!opt) return;
  document.getElementById(id).value = opt.id;
  document.getElementById(id+'-input').value = opt.name;
  document.getElementById(id+'-list').classList.remove('open');
}
function acHighlight(id){
  const list = document.getElementById(id+'-list');
  if(!list) return;
  Array.from(list.children).forEach((el,i)=> el.classList.toggle('active', i===autocompleteActiveIndex[id]));
}
function acKeydown(event, id){
  const list = document.getElementById(id+'-list');
  if(!list || !list.classList.contains('open')) return;
  const matches = autocompleteMatches[id] || [];
  if(event.key === 'ArrowDown'){
    event.preventDefault();
    autocompleteActiveIndex[id] = Math.min((autocompleteActiveIndex[id] ?? -1) + 1, matches.length-1);
    acHighlight(id);
  } else if(event.key === 'ArrowUp'){
    event.preventDefault();
    autocompleteActiveIndex[id] = Math.max((autocompleteActiveIndex[id] ?? 0) - 1, 0);
    acHighlight(id);
  } else if(event.key === 'Enter'){
    event.preventDefault();
    /* Never guess: Enter confirms a highlighted row, or the only remaining
       match. With several matches and nothing highlighted it does nothing —
       silently picking the first of three "Μαρία"s booked the wrong person. */
    const idx = autocompleteActiveIndex[id] ?? -1;
    const pick = matches[idx] || (matches.length === 1 ? matches[0] : null);
    if(pick) acSelect(id, pick.id);
  } else if(event.key === 'Escape'){
    event.stopPropagation();
    list.classList.remove('open');
  }
}
/* Runs on blur, delayed so a mousedown-selection on a list item (which fires
   before blur) has already completed. Also snaps the visible text back in
   sync with whatever's actually selected — if the person typed something
   and clicked away without picking a match, both the hidden value and the
   displayed text are cleared rather than left in a mismatched state. */
function acClose(id){
  setTimeout(() => {
    const list = document.getElementById(id+'-list');
    if(list) list.classList.remove('open');
    const hidden = document.getElementById(id);
    const input = document.getElementById(id+'-input');
    if(!hidden || !input) return;
    const opt = (autocompleteOptions[id]||[]).find(o=>o.id===hidden.value);
    input.value = opt ? opt.name : '';
    if(!opt) hidden.value = '';
  }, 150);
}

/* ---------------- Dashboard ---------------- */
function renderNeedsAttentionCard(){
  /* One merged, actionable list instead of four small name-only lists: every
     member who is low-on or out-of classes in either category, one row per
     (member, category) they need attention in, sorted worst-first so the
     people who need a renewal call most urgently are at the top. */
  const rows = [];
  CLASS_CATEGORIES.forEach(cat => {
    data.members.forEach(m => {
      const st = memberStatus(m.id, cat);
      if(st.cls === 'warn' || st.cls === 'danger'){
        const lastAttended = memberAttendance(m.id).find(a => attendanceCategory(a) === cat && isPresentRecord(a))?.date;
        rows.push({ m, cat, st, remaining: classesRemaining(m.id, cat), lastAttended });
      }
    });
  });
  rows.sort((a,b) => a.remaining - b.remaining);
  const uniqueMembers = new Set(rows.map(r => r.m.id)).size;

  return { count: uniqueMembers, html: `
    <div class="card">
      <div class="section-title">Χρειάζονται Προσοχή (χαμηλό υπόλοιπο ή χωρίς μαθήματα)</div>
      ${rows.length===0 ? '<div class="empty">Όλοι έχουν αρκετά μαθήματα. 🎉</div>' :
      `<div class="table-scroll"><table>
        <thead><tr><th>Όνομα</th><th>Τηλέφωνο</th><th>Κατηγορία</th><th>Υπόλοιπο</th><th>Κατάσταση</th><th>Τελ. Παρουσία</th><th></th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td><a href="#" onclick="viewMember('${r.m.id}');return false;">${escapeHtml(r.m.name)}</a></td>
            <td>${escapeHtml(r.m.phone||'—')}</td>
            <td>${categoryBadge(r.cat)}</td>
            <td>${r.remaining}</td>
            <td><span class="badge ${r.st.cls}">${r.st.label}</span></td>
            <td>${r.lastAttended ? formatDate(r.lastAttended) : '—'}</td>
            <td><button class="btn small" onclick="openPaymentForm('${r.m.id}')">+ Πληρωμή</button></td>
          </tr>`).join('')}
        </tbody>
      </table></div>`}
    </div>
  `};
}

          ${todaysClasses.map(s=>`<tr style="cursor:pointer;" onclick="viewOccurrence('${s.seriesId}','${today}')">
            <td>${s.startTime}–${s.endTime}</td>

let memberSearch = '';
function renderMemberTable(list){

function saveMember(id){

  if(!name){ alert('Παρακαλώ εισάγετε ένα όνομα.'); return; }
  const rec = {
    name,
    phone: document.getElementById('f-phone').value.trim(),
    email: document.getElementById('f-email').value.trim(),
    joinDate: document.getElementById('f-join').value || todayStr(),
    notes: document.getElementById('f-notes').value.trim(),
  };
  if(id){
    Object.assign(data.members.find(m=>m.id===id), rec);
  } else {
    rec.id = uid();
    data.members.push(rec);
  }
  saveData();
  closeModal();
  render();

function deleteMember(id){
  if(!confirm('Διαγραφή αυτού του μέλους και όλου του ιστορικού παρουσιών/πληρωμών; Αυτό δεν μπορεί να αναιρεθεί.')) return;
  data.members = data.members.filter(m=>m.id!==id);
  data.attendance = data.attendance.filter(a=>a.memberId!==id);
  data.payments = data.payments.filter(p=>p.memberId!==id);
  data.schedule.forEach(s => s.memberIds = s.memberIds.filter(mid=>mid!==id));
  /* Per-date membership deltas reference members too — a stale id left in
     addMemberIds kept occupying a seat in that date's capacity, and
     markClassPresent() then created attendance for a member that no longer
     existed. Overrides left with nothing meaningful are dropped entirely. */
  data.scheduleOverrides.slice().forEach(o => {
    if(o.addMemberIds) o.addMemberIds = o.addMemberIds.filter(mid=>mid!==id);
    if(o.removeMemberIds) o.removeMemberIds = o.removeMemberIds.filter(mid=>mid!==id);
    cleanupOverride(o);
  });
  saveData();
  closeModal();
  render();
}

/* Any attendance record can be removed from the member card — including ones
   for classes/dates that no longer appear in any roster (class deleted, member
   taken off it), which would otherwise keep costing a credit with no way to
   undo. (member, date, slot) is unique, see setClassStatus()/markClassPresent(). */
function deleteAttendanceRecord(memberId, date, slotId){
  const rec = data.attendance.find(a => a.memberId===memberId && a.date===date && (a.slotId||'')===slotId);
  if(!rec) return;
  if(!confirm(`Διαγραφή της καταγραφής παρουσίας της ${formatDate(date)}; Το μάθημα θα επιστραφεί στο μέλος.`)) return;
  data.attendance = data.attendance.filter(a => a !== rec);
  saveData();
  render();
  viewMember(memberId);
}
function renderMemberClassSection(m){
  const today = todayStr();
  /* Ended segments (validUntil in the past, left behind by "this and
     following" splits) are history, not current enrollment — without this
     filter a member showed up "enrolled" in the same class once per split.
     Among the still-valid segments, a split class can appear several times
     with identical day/time/name — show it once, represented by the segment
     that's active soonest (so the ✕ scope prompt anchors to the very next
     occurrence). */
  const seenClass = {};
  const enrolled = data.schedule.filter(s => s.memberIds.includes(m.id) && (!s.validUntil || s.validUntil >= today))
    .sort((a,b)=> (a.validFrom||'') < (b.validFrom||'') ? -1 : 1)
    .filter(s => {
      const k = [s.day, s.startTime, s.endTime, s.className, s.category].join('|');
      if(seenClass[k]) return false;
      seenClass[k] = true;
      return true;
    })
    .sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || (a.startTime<b.startTime?-1:1));
  /* Only offer series that are still currently active (not ended by a
     "this and following" split/delete) — enrolling into a series that has
     already stopped recurring would silently do nothing going forward. */
  const available = data.schedule.filter(s => !s.memberIds.includes(m.id) && s.memberIds.length < s.capacity && seriesActiveOn(s, today))
    .sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || (a.startTime<b.startTime?-1:1));
  /* Upcoming one-date membership changes for this member: an extra visit
     booked into a single occurrence, or a "won't come that day" exception.
     Past deltas are history and stay off the card. */
  const deltas = [];
  data.scheduleOverrides.forEach(o => {
    if(o.date < today) return;
    const isAdd = (o.addMemberIds||[]).includes(m.id);
    const isRemove = (o.removeMemberIds||[]).includes(m.id);
    if(!isAdd && !isRemove) return;
    const series = data.schedule.find(s=>s.id===o.seriesId);
    if(!series) return;
    /* A delta on a cancelled date is dormant (it applies again if the date
       is restored) — shown, so it can still be found and undone. */
    const occ = occurrenceForSeriesOnDate(series, o.date) || { startTime: o.startTime ?? series.startTime, endTime: o.endTime ?? series.endTime, className: o.className ?? series.className };
    deltas.push({ date: o.date, seriesId: o.seriesId, occ, isAdd, cancelled: !!o.cancelled });
  });
  deltas.sort((a,b)=> a.date < b.date ? -1 : 1);
  return `
    ${enrolled.length===0 ? '<div class="subtle">Δεν έχει κλείσει θέση σε κανένα μάθημα.</div>' :
      enrolled.map(s=>`<div class="enrolled-item"><span>${DAY_SHORT[s.day]} ${s.startTime}–${s.endTime} — ${escapeHtml(s.className)} ${categoryBadge(s.category)}</span><button class="icon-btn" onclick="removeMemberFromClass('${m.id}','${s.id}')">✕</button></div>`).join('')}
    ${deltas.length===0 ? '' : `
      <div class="subtle" style="font-weight:700;margin-top:10px;">Αλλαγές μίας ημερομηνίας</div>
      ${deltas.map(d=>`<div class="enrolled-item"><span>${formatDate(d.date)} · ${d.occ.startTime}–${d.occ.endTime} — ${escapeHtml(d.occ.className)} <span class="badge ${d.isAdd?'ok':'warn'}">${d.isAdd?'έξτρα συμμετοχή':'δεν θα έρθει'}</span>${d.cancelled?' <span class="badge muted">ακυρωμένο μάθημα</span>':''}</span><button class="icon-btn" title="Αναίρεση" onclick="undoMembershipDelta('${m.id}','${d.seriesId}','${d.date}')">↩</button></div>`).join('')}
    `}
    ${available.length===0 ? '' :
      `<div class="form-row" style="align-items:flex-end;margin-top:8px;">
        <div><select id="f-member-add-slot">${available.map(s=>`<option value="${s.id}">${DAY_SHORT[s.day]} ${s.startTime}–${s.endTime} — ${escapeHtml(s.className)} (${escapeHtml(s.category)})</option>`).join('')}</select></div>
        <div style="flex:0 0 auto;"><button class="btn small" onclick="addMemberToClass('${m.id}')">Προσθήκη</button></div>
      </div>`}
  `;
}
/* The next real calendar date this series occurs on — the reference date the
   member card's scope prompt anchors to ("skip just next Monday"). 28 days
   covers any validFrom/validUntil window that still has a future occurrence. */
function nextOccurrenceDateFor(series){
  const today = todayStr();
  for(let i=0;i<28;i++){
    const d = addDaysLocalStr(today, i);
    if(dayAbbrev(d)===series.day && seriesActiveOn(series, d)) return d;
  }
  return null;
}
function addMemberToClass(memberId){
  const slotId = document.getElementById('f-member-add-slot').value;
  const s = data.schedule.find(x=>x.id===slotId);
  if(!s) return;
  const next = nextOccurrenceDateFor(s);
  if(!next){
    /* No future occurrence to scope against (series about to end) — the only
       meaningful change is the base list. */
    if(!s.memberIds.includes(memberId)) s.memberIds.push(memberId);
    saveData();
    viewMember(memberId);
    return;
  }
  openMembershipScopeModal(slotId, next, memberId, 'add', 'member');
}
function removeMemberFromClass(memberId, slotId){
  const s = data.schedule.find(x=>x.id===slotId);
  if(!s) return;
  const next = nextOccurrenceDateFor(s);
  if(!next){
    s.memberIds = s.memberIds.filter(id=>id!==memberId);
    saveData();
    viewMember(memberId);
    return;
  }
  openMembershipScopeModal(slotId, next, memberId, 'remove', 'member');
}
/* Undo one member's per-date delta from the member card. */
function undoMembershipDelta(memberId, seriesId, date){
  const ov = data.scheduleOverrides.find(o=>o.seriesId===seriesId && o.date===date);
  if(ov){
    if(ov.addMemberIds) ov.addMemberIds = ov.addMemberIds.filter(id=>id!==memberId);
    if(ov.removeMemberIds) ov.removeMemberIds = ov.removeMemberIds.filter(id=>id!==memberId);
    cleanupOverride(ov);
    saveData();
  }
  viewMember(memberId);
}

/* ---------------- Employees ---------------- */
/* A predefined picklist of staff names for the "Όνομα Μαθήματος" field in the
   schedule form — a class in this gym is identified by which trainer runs it.
   Kept as a simple {id, name} list managed here so the schedule form can

/* Every employee is classified into one of the same CLASS_CATEGORIES as

function saveEmployee(id){
  const name = document.getElementById('f-emp-name').value.trim();
  if(!name){ alert('Παρακαλώ εισάγετε ένα όνομα.'); return; }
  const category = document.getElementById('f-emp-category').value;
  /* Classes, colours and the class tally are all keyed by the employee's
     name, so two employees sharing one name would silently merge. */
  if(data.employees.some(x => x.id !== id && x.name === name)){ alert('Υπάρχει ήδη υπάλληλος με αυτό το όνομα.'); return; }
  if(id){
    const e = data.employees.find(e=>e.id===id);
    const oldName = e.name;
    Object.assign(e, { name, category });
    /* Classes are identified by their trainer's name (a plain string on the
       series), so a rename must follow through to the schedule — otherwise
       the schedule keeps showing the old name and the employee's class tally,
       color and dropdown entry all silently detach from them. Attendance is
       keyed by series id, so nothing about credits changes. */
    if(oldName !== name && !data.employees.some(x => x.id !== id && x.name === oldName)){
      data.schedule.forEach(s => { if(s.className === oldName) s.className = name; });
      data.scheduleOverrides.forEach(o => { if(o.className === oldName) o.className = name; });
    }
