/* ---------------- Schedule (recurring series + per-date overrides) ---------------- */
/* The program is a set of weekly-recurring "series" (data.schedule, unchanged
   shape from before) each optionally bounded by validFrom/validUntil, plus a
   list of per-(series,date) overrides (data.scheduleOverrides) that patch or
   cancel ONE specific occurrence without touching the series. This is what
   lets "change every Monday from now on" (bound/split the series) and
   "change just this one Monday" (add a single-date override) coexist:
     - editing with scope "only this date"      -> upsert an override
     - editing with scope "this and following"  -> end the series the day
       before, start a new series from this date with the edits baked in
     - editing with scope "all occurrences"      -> edit the series in place
   Attendance keeps keying off the series id (slotId) exactly as before —
   overrides never introduce a second id space attendance needs to know
   about — so every existing attendance/category/ledger function below is
   untouched by this feature. */
function seriesActiveOn(series, dateStr){
  return dateStr >= (series.validFrom || '') && (!series.validUntil || dateStr <= series.validUntil);
}
/* Resolves what actually happens for one series on one date: null if that
   occurrence was cancelled via an override, otherwise the series' fields
   with any override fields patched on top. */
function occurrenceForSeriesOnDate(series, dateStr){
  const ov = data.scheduleOverrides.find(o => o.seriesId === series.id && o.date === dateStr);
  if(ov && ov.cancelled) return null;
  /* Membership can also be overridden per date: the effective list is the
     series' base list minus this date's removals plus this date's additions. */
  const added = ov?.addMemberIds || [];
  const removed = ov?.removeMemberIds || [];
  let memberIds = series.memberIds;
  if(added.length || removed.length){
    memberIds = series.memberIds.filter(id => !removed.includes(id))
      .concat(added.filter(id => !series.memberIds.includes(id)));
  }
  return {
    seriesId: series.id,
    date: dateStr,
    day: series.day,
    startTime: ov?.startTime ?? series.startTime,
    endTime: ov?.endTime ?? series.endTime,
    className: ov?.className ?? series.className,
    category: ov?.category ?? series.category,
    capacity: ov?.capacity ?? series.capacity,
    comments: ov?.comments ?? series.comments,
    memberIds,
    hasOverride: !!ov,
  };
}
function occurrencesForDate(dateStr){
  const dayCode = dayAbbrev(dateStr);
  return data.schedule
    .filter(s => s.day === dayCode && seriesActiveOn(s, dateStr))
    .map(s => occurrenceForSeriesOnDate(s, dateStr))
    .filter(Boolean)
    .sort((a,b) => a.startTime < b.startTime ? -1 : 1);
}
/* The category a NEW attendance record on (seriesId, dateStr) should be
   stamped with — resolves any per-date override so e.g. a one-off category
   change for a single Monday correctly draws down that category's credits,
   not the series' usual one. */
function occurrenceCategoryOn(seriesId, dateStr){
  const series = data.schedule.find(x => x.id === seriesId);
  if(!series) return null;
  const occ = occurrenceForSeriesOnDate(series, dateStr);
  return occ ? occ.category : (series.category || CLASS_CATEGORIES[0]);
}
function dayBeforeStr(dateStr){ return addDaysLocalStr(dateStr, -1); }
/* Ends `series` the day before `date` and starts a new segment from `date`
   whose base values are `fields` (day and member list are carried over).
   Overrides AND attendance on/after the split date move to the new segment —
   attendance left on the old id would disappear from the rosters (which key
   on the occurrence's seriesId), and re-marking someone already marked would
   create a second record and charge them twice for the same class. The old
   category is pinned onto moved records first: those visits happened under
   the old settings, and moving them must not re-categorize them.
   Callers must ensure date > validFrom — splitting at the first occurrence
   would strand an empty, unreachable old segment (edit in place instead). */
function splitSeriesAt(series, date, fields){
  const oldValidUntil = series.validUntil;
  series.validUntil = dayBeforeStr(date);
  const newSeries = { id: uid(), day: series.day, memberIds: series.memberIds.slice(), validFrom: date, validUntil: oldValidUntil, ...fields };
  data.schedule.push(newSeries);
  data.scheduleOverrides.forEach(o => { if(o.seriesId === series.id && o.date >= date) o.seriesId = newSeries.id; });
  const oldCat = series.category || CLASS_CATEGORIES[0];
  data.attendance.forEach(a => {
    if(a.slotId === series.id && a.date >= date){
      if(!a.category) a.category = oldCat;
      a.slotId = newSeries.id;
    }
  });
  return newSeries;
}

/* The per-occurrence fields an override can patch; a series' own value for
   each, normalized the same way the form reads it. */
const OCC_FIELDS = ['startTime','endTime','className','category','capacity','comments'];
function seriesFieldValue(series, k){
  return k === 'category' ? (series.category || CLASS_CATEGORIES[0]) : (k === 'comments' ? (series.comments || '') : series[k]);
}
/* Removes field patches that no longer differ from the series, keeping any
   membership deltas / cancellation, and drops the override if nothing is left. */
function pruneRedundantOverride(ov, series){
  OCC_FIELDS.forEach(k => { if(ov[k] != null && ov[k] === seriesFieldValue(series, k)) delete ov[k]; });
  cleanupOverride(ov);
}
function saveOccurrenceEdit(seriesId, date){
  const f = readSlotFormFields();
  if(!f.className){ alert('Δεν υπάρχει υπάλληλος σε αυτή την κατηγορία. Προσθέστε έναν πρώτα (καρτέλα Υπάλληλοι).'); return; }
  if(f.endTime <= f.startTime){ alert('Η ώρα λήξης πρέπει να είναι μετά την ώρα έναρξης.'); return; }
  const scope = document.querySelector('input[name="f-scope"]:checked').value;
  const series = data.schedule.find(x=>x.id===seriesId);
  if(!series) return;

  if(scope === 'only'){
    /* Store only the fields that actually differ from the series, so a form
       saved unchanged doesn't leave a ✱ "customized" marker behind — and an
       edit that puts everything back to the series' values removes it. */
    let ov = data.scheduleOverrides.find(o=>o.seriesId===seriesId && o.date===date);
    if(!ov){ ov = { id: uid(), seriesId, date }; data.scheduleOverrides.push(ov); }
    OCC_FIELDS.forEach(k => { if(f[k] === seriesFieldValue(series, k)) delete ov[k]; else ov[k] = f[k]; });
    delete ov.cancelled;
    cleanupOverride(ov);
  } else {
    /* Later segments of the same class (left behind by earlier splits) must
       receive a "following" edit too, and an "all" edit reaches every
       segment — otherwise the change silently reverts the day the next
       segment takes over. Collected BEFORE the split so the fresh segment
       isn't mistaken for a pre-existing sibling. */
    const siblings = data.schedule.filter(s => isSiblingSegment(series, s) && (scope === 'all' || (s.validFrom || '') >= date));
    const applyFields = s => {
      /* Changing a segment's category must not re-categorize its past
         attendance — pin the old category onto any record that still relied
         on the live lookup, same as the old single-series edit did. */
      const oldCat = s.category || CLASS_CATEGORIES[0];
      if(oldCat !== f.category) data.attendance.forEach(a => { if(a.slotId === s.id && !a.category) a.category = oldCat; });
      Object.assign(s, f);
      /* Per-date patches that now merely repeat the base values would leave
         a stale ✱ behind; membership deltas and cancellations are kept. */
      data.scheduleOverrides.slice().forEach(o => { if(o.seriesId === s.id) pruneRedundantOverride(o, s); });
    };
    if(scope === 'following' && (!series.validFrom || date > series.validFrom)){
      const newSeries = splitSeriesAt(series, date, f);
      /* This date's field patches are redundant now (they ARE the new
         segment's base values) — but a one-day membership change made for
         this same date is a separate decision and stays. */
      const ov = data.scheduleOverrides.find(o => o.seriesId===newSeries.id && o.date===date);
      if(ov) pruneRedundantOverride(ov, newSeries);
    } else { // 'all' — or 'following' from the series' first occurrence, where a
             // split would only leave behind an empty, unreachable old segment
      applyFields(series);
    }
    siblings.forEach(applyFields);
  }
  saveData();
  closeModal();
  render();
}

  if(!confirm('Είστε σίγουρος/η;')) return;
  const series = data.schedule.find(x=>x.id===seriesId);
  if(!series) return;
  /* Ending a series the day before its own first occurrence would leave a
     segment with validUntil < validFrom — never rendered again, impossible
     to reach from the UI, but still stored forever. Deleting "this and
     following" from the very first date IS deleting the whole series. */
  if(scope === 'following' && series.validFrom && date <= series.validFrom) scope = 'all';
  if(scope === 'only'){
    /* Attendance already marked for this date belongs to a class that is now
       being cancelled — leaving it would keep charging those members for a
       class that never ran, invisibly (the roster hides cancelled dates).
       Ask, and remove it together with the occurrence. */
    const marked = data.attendance.filter(a => a.slotId===seriesId && a.date===date);
    if(marked.length > 0){
      if(!confirm(`Υπάρχουν ήδη ${marked.length} καταγραφές παρουσίας για αυτή την ημερομηνία. Θα διαγραφούν μαζί με το μάθημα (τα μαθήματα θα επιστραφούν στα μέλη). Συνέχεια;`)) return;
      data.attendance = data.attendance.filter(a => !(a.slotId===seriesId && a.date===date));
    }
    let ov = data.scheduleOverrides.find(o=>o.seriesId===seriesId && o.date===date);
    if(!ov){ ov = { id: uid(), seriesId, date }; data.scheduleOverrides.push(ov); }
    /* Field patches die with the cancelled occurrence; one-day membership
       changes are kept so that restoring the date brings them back. */
    OCC_FIELDS.forEach(k => delete ov[k]);
    ov.cancelled = true;
  } else if(scope === 'following'){
    /* Every later segment of this same class goes too — ending only this
       segment would let the class silently reappear the day the next one
       takes over. */
    const laterSiblings = data.schedule.filter(s => isSiblingSegment(series, s) && (s.validFrom || '') >= date);
    const goneIds = [seriesId, ...laterSiblings.map(s => s.id)];
    /* Same reasoning as the single-date case: attendance already marked on
       dates that are now being deleted would keep charging members for
       classes that (per this deletion) never ran, invisibly. */
    const marked = data.attendance.filter(a => goneIds.includes(a.slotId) && a.date >= date);
    if(marked.length > 0){
      if(!confirm(`Υπάρχουν ήδη ${marked.length} καταγραφές παρουσίας από ${formatDate(date)} και μετά. Θα διαγραφούν μαζί με τα μαθήματα (τα μαθήματα θα επιστραφούν στα μέλη). Συνέχεια;`)) return;
      data.attendance = data.attendance.filter(a => !(goneIds.includes(a.slotId) && a.date >= date));
    }
    series.validUntil = dayBeforeStr(date);
    data.schedule = data.schedule.filter(s => !laterSiblings.includes(s));
    data.scheduleOverrides = data.scheduleOverrides.filter(o => !(goneIds.includes(o.seriesId) && o.date >= date));
  } else { // 'all'
    /* Pin the series' category onto its attendance history before it goes
       away — otherwise those records would fall back to Βάρη and consumed
       credits in other categories would silently be "refunded". */
    const cat = series.category || CLASS_CATEGORIES[0];
    data.attendance.forEach(a => { if(a.slotId === seriesId && !a.category) a.category = cat; });
    data.schedule = data.schedule.filter(x=>x.id!==seriesId);
    data.scheduleOverrides = data.scheduleOverrides.filter(o=>o.seriesId!==seriesId);
  }
  saveData();
  closeModal();
  render();
}
/* A date cancelled by mistake can be brought back: the cancellation is only
   an override flag, so dropping it restores the series' normal occurrence. */
function restoreOccurrence(seriesId, date){
  const ov = data.scheduleOverrides.find(o=>o.seriesId===seriesId && o.date===date);
  if(!ov || !ov.cancelled) return;
  delete ov.cancelled;
  cleanupOverride(ov);
  saveData();
  render();
}
function cancelledSeriesForDate(dateStr){
  const dayCode = dayAbbrev(dateStr);
  return data.schedule.filter(s => s.day === dayCode && seriesActiveOn(s, dateStr) &&
    data.scheduleOverrides.some(o => o.seriesId === s.id && o.date === dateStr && o.cancelled))
    .sort((a,b) => a.startTime < b.startTime ? -1 : 1);
}
function addToSlot(slotId, date){
  const memberId = document.getElementById('f-add-member').value;
  if(!memberId){ alert('Παρακαλώ επιλέξτε ένα μέλος από τη λίστα.'); return; }
  openMembershipScopeModal(slotId, date, memberId, 'add');
}
function removeFromSlot(slotId, memberId, date){
  openMembershipScopeModal(slotId, date, memberId, 'remove');
}
/* Adding/removing a member asks for a scope, exactly like editing or deleting
   an occurrence does: one date only (a per-date membership delta on that
   date's override), this-and-following (split the series, same as field
   edits), or every occurrence (the series' base list, the only behavior that
   existed before per-date membership). */
function openMembershipScopeModal(seriesId, date, memberId, action, origin){
  /* origin: 'occ' (default) reached from the class occurrence modal, 'member'
     reached from the member card — decides which view to return to. From the
     member card there's no specific date on screen, so the prompt anchors to
     the class's NEXT occurrence (nextOccurrenceDateFor). */
  origin = origin || 'occ';
  const m = data.members.find(x=>x.id===memberId);
  const title = `${action==='add' ? 'Προσθήκη' : 'Αφαίρεση'}: ${m ? m.name : 'μέλος'}`;
  const args = `'${seriesId}','${date}','${memberId}','${action}'`;
  openModal(`
    <h3>${escapeHtml(title)}</h3>
    <div class="subtle" style="margin-bottom:14px;">Επιλέξτε πού θα εφαρμοστεί η αλλαγή.</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <button class="btn" onclick="applyMembershipChange(${args},'only','${origin}')">Μόνο σε αυτή την ημερομηνία (${formatDate(date)})</button>
      <button class="btn" onclick="applyMembershipChange(${args},'following','${origin}')">Σε αυτή και όλες τις επόμενες επαναλήψεις</button>
      <button class="btn" onclick="applyMembershipChange(${args},'all','${origin}')">Σε όλες τις επαναλήψεις (παρελθόν και μέλλον)</button>
    </div>
    <div class="modal-actions">
      <button class="btn secondary" onclick="${origin==='member' ? `viewMember('${memberId}')` : `viewOccurrence('${seriesId}','${date}')`}">Ακύρωση</button>
    </div>
  `);
}
/* Two series are consecutive segments of the SAME class (left behind by
   "this and following" splits) when they share day, start time, trainer and
   category AND their validity windows never overlap — segments of one chain
   are strictly consecutive. Two classes that genuinely run in parallel (a
   weights class and a pilates class both at Monday 18:00) overlap in time,
   so they are never treated as siblings and never receive each other's
   membership changes. */
function isSiblingSegment(a, b){
  if(a.id === b.id) return false;
  if(a.day !== b.day || a.startTime !== b.startTime || a.className !== b.className ||
     (a.category || CLASS_CATEGORIES[0]) !== (b.category || CLASS_CATEGORIES[0])) return false;
  const aFrom = a.validFrom || '', bFrom = b.validFrom || '';
  const aUntil = a.validUntil || '9999-12-31', bUntil = b.validUntil || '9999-12-31';
  const overlap = aFrom <= bUntil && bFrom <= aUntil;
  return !overlap;
}
/* Drops delta fields that no longer do anything, and the whole override once
   nothing about the occurrence is customized any more — so the ✱ marker only
   ever shows on dates that really differ from the series. */
function cleanupOverride(ov){
  if(ov.addMemberIds && ov.addMemberIds.length===0) delete ov.addMemberIds;
  if(ov.removeMemberIds && ov.removeMemberIds.length===0) delete ov.removeMemberIds;
  const meaningful = ov.cancelled || ov.startTime != null || ov.endTime != null || ov.className != null ||
    ov.category != null || ov.capacity != null || ov.comments != null || ov.addMemberIds || ov.removeMemberIds;
  if(!meaningful) data.scheduleOverrides = data.scheduleOverrides.filter(o => o !== ov);
}
function applyMembershipChange(seriesId, date, memberId, action, scope, origin){
  const series = data.schedule.find(x=>x.id===seriesId);
  if(!series) return;
  let viewId = seriesId;
  const returnToView = () => origin==='member' ? viewMember(memberId) : viewOccurrence(viewId, date);
  if(action === 'add'){
    const occ = occurrenceForSeriesOnDate(series, date);
    if(occ && occ.memberIds.length >= occ.capacity){ alert('Αυτό το μάθημα είναι πλήρες.'); returnToView(); return; }
    /* A recurring add fills a seat on EVERY affected date, so the base
       lists of this segment and of every sibling it will reach must have
       room too — not just the one date on screen. */
    if(scope !== 'only'){
      const affected = [series, ...data.schedule.filter(s => isSiblingSegment(series, s) && (scope === 'all' || (s.validFrom || '') >= date))];
      const baseFull = affected.some(s => !s.memberIds.includes(memberId) && s.memberIds.length >= s.capacity);
      /* ...and dates that already carry one-day additions or a smaller
         one-day capacity can be full even when the base list isn't. */
      const overrideFull = data.scheduleOverrides.some(o => {
        const s = affected.find(x => x.id === o.seriesId);
        if(!s || (scope === 'following' && o.date < date)) return false;
        const occ = occurrenceForSeriesOnDate(s, o.date);
        return occ && !occ.memberIds.includes(memberId) && occ.memberIds.length >= occ.capacity;
      });
      if(baseFull || overrideFull){
        alert('Αυτό το μάθημα είναι πλήρες σε κάποιες από τις επαναλήψεις που θα επηρεάζονταν. Προσθέστε το μέλος μόνο σε συγκεκριμένη ημερομηνία ή αυξήστε τη χωρητικότητα.');
        returnToView(); return;
      }
    }
  }
  if(scope === 'only'){
    let ov = data.scheduleOverrides.find(o=>o.seriesId===seriesId && o.date===date);
    if(!ov){ ov = { id: uid(), seriesId, date }; data.scheduleOverrides.push(ov); }
    ov.addMemberIds = ov.addMemberIds || [];
    ov.removeMemberIds = ov.removeMemberIds || [];
    if(action === 'add'){
      /* Un-removing a base member IS the add; only someone outside the base
         list needs an explicit per-date addition. */
      ov.removeMemberIds = ov.removeMemberIds.filter(id=>id!==memberId);
      if(!series.memberIds.includes(memberId) && !ov.addMemberIds.includes(memberId)) ov.addMemberIds.push(memberId);
    } else {
      ov.addMemberIds = ov.addMemberIds.filter(id=>id!==memberId);
      if(series.memberIds.includes(memberId) && !ov.removeMemberIds.includes(memberId)) ov.removeMemberIds.push(memberId);
    }
    cleanupOverride(ov);
  } else {
    let target = series;
    if(scope === 'following' && (!series.validFrom || date > series.validFrom)){
      const { startTime, endTime, className, category, capacity, comments } = series;
      target = splitSeriesAt(series, date, { startTime, endTime, className, category, capacity, comments });
      viewId = target.id;
    }
    const applyTo = s => {
      if(action === 'add'){ if(!s.memberIds.includes(memberId)) s.memberIds.push(memberId); }
      else s.memberIds = s.memberIds.filter(id=>id!==memberId);
    };
    applyTo(target);
    /* A class that has been split lives as several consecutive segments.
       "Following" and "all" must reach the sibling segments too — otherwise
       a removed member silently pops back into the class the day the next
       segment takes over. See isSiblingSegment() for what counts as the
       same class — notably NOT a different trainer's class that merely runs
       in parallel at the same hour. */
    data.schedule.forEach(s => {
      if(!isSiblingSegment(target, s)) return;
      if(scope === 'all' || (s.validFrom || '') >= date) applyTo(s);
    });
    /* A leftover per-date delta for this member on the date being viewed
       would mask the change on that very date — clear it. Deltas explicitly
       set on OTHER dates stay: they were one-date decisions of their own. */
    const ov = data.scheduleOverrides.find(o=>o.seriesId===target.id && o.date===date);
    if(ov){
      if(ov.addMemberIds) ov.addMemberIds = ov.addMemberIds.filter(id=>id!==memberId);
      if(ov.removeMemberIds) ov.removeMemberIds = ov.removeMemberIds.filter(id=>id!==memberId);
      cleanupOverride(ov);
    }
  }
  saveData();
  returnToView();
}

/* Shared month-grid renderer behind both the Attendance and Schedule pages'
   collapsible calendars — same layout/markup, parameterized by what counts
   as "selected" (a single day for attendance, a whole week for schedule),
   what number badge each day shows, and which handler names to wire up (the
   two pages keep independent open/month/selection state, so this only
   builds the grid itself). */
function renderCalendarGrid(calMonth, isSelectedFn, countFn, selectHandler, shiftHandler, todayHandler){
  const [y, mo] = calMonth.split('-').map(Number);
  const first = new Date(y, mo-1, 1);
  const startDow = (first.getDay() + 6) % 7; // Monday = 0
  const daysInMonth = new Date(y, mo, 0).getDate();

  const cells = [];
  for(let i=0; i<startDow; i++) cells.push(null);
  for(let d=1; d<=daysInMonth; d++) cells.push(`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  while(cells.length % 7 !== 0) cells.push(null);

  const monthLabel = first.toLocaleDateString('el-GR', {month:'long', year:'numeric'});
  const today = todayStr();

  return `
    <div class="cal-header">
      <button class="btn secondary small" onclick="${shiftHandler}(-1)">‹ Προηγ.</button>
      <div class="cal-month-label">${monthLabel}</div>
      <button class="btn secondary small" onclick="${shiftHandler}(1)">Επόμ. ›</button>
      <button class="btn secondary small" onclick="${todayHandler}()">Σήμερα</button>
    </div>
    <div class="cal-grid">
      ${DAYS.map(d=>`<div class="cal-dow">${DAY_SHORT[d]}</div>`).join('')}
      ${cells.map(c=>{
        if(!c) return `<div class="cal-cell cal-empty"></div>`;
        const count = countFn(c);
        const cls = ['cal-cell'];
        if(c === today) cls.push('cal-today');
        if(isSelectedFn(c)) cls.push('cal-selected');
        if(count > 0) cls.push('cal-has-att');
        const dayNum = parseInt(c.slice(8,10));
        return `<div class="${cls.join(' ')}" onclick="${selectHandler}('${c}')">
          <div class="cal-daynum">${dayNum}</div>
          ${count>0 ? `<div class="cal-count">${count} ✓</div>` : ''}
        </div>`;
      }).join('')}
    </div>
  `;
}
function renderAttendanceCalendar(){
  /* Only actual presences get a ✓ badge — absences (justified or not) are not
     "people who came", matching attendanceCounts() and the dashboard stats. */
  const counts = {};
  data.attendance.forEach(a => { if(isPresentRecord(a)) counts[a.date] = (counts[a.date] || 0) + 1; });
  return renderCalendarGrid(
    attendanceCalMonth,
    c => c === attendanceDate,
    c => counts[c] || 0,
    'selectCalDate', 'calShiftMonth', 'calGoToday'
  );
}
function calShiftMonth(delta){
  const [y, mo] = attendanceCalMonth.split('-').map(Number);
  const d = new Date(y, mo-1+delta, 1);
  attendanceCalMonth = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');

}

function renderClassRosters(){
  const dayCode = dayAbbrev(attendanceDate);
  const occs = occurrencesForDate(attendanceDate).filter(o => attendanceCategoryFilter==='all' || o.category===attendanceCategoryFilter);
  if(occs.length===0) return '';
  return `
    <div class="card">
      <div class="section-title">Μαθήματα (${DAY_FULL[dayCode]})</div>
      ${occs.map((s,i)=>{
        const enrolled = s.memberIds.map(mid=>data.members.find(m=>m.id===mid)).filter(Boolean).sort((a,b)=>a.name.localeCompare(b.name,'el'));
        /* Presence/absence is scoped to THIS class (matched by slotId=seriesId
           plus the date), not just the date — a member enrolled in both a
           gym and a pilates class on the same day gets an independent status
           in each roster. */
        const rows = enrolled.map(m=>{
          const rec = attendanceRecordFor(m.id, attendanceDate, s.seriesId);
          return { m, status: rec ? recordStatus(rec) : null, note: rec ? (rec.note||'') : '', extra: false };
        });
        /* Someone marked for this class/date and THEN taken off the roster
           (a one-day removal, or dropped from the series) still holds a
           record that costs a credit. It must stay visible here so it can be
           corrected — otherwise it silently charges them forever. */
        data.attendance.filter(a => a.slotId===s.seriesId && a.date===attendanceDate && !s.memberIds.includes(a.memberId)).forEach(rec => {
          const m = data.members.find(x => x.id === rec.memberId);
          if(m) rows.push({ m, status: recordStatus(rec), note: rec.note||'', extra: true });
        });
        const presentCount = rows.filter(r=>r.status==='present').length;
        const justifiedCount = rows.filter(r=>r.status==='justified').length;
        const unjustifiedCount = rows.filter(r=>r.status==='unjustified').length;
        const allMarked = enrolled.length>0 && rows.every(r=>r.status!==null);
        return `<div${i<occs.length-1?' style="margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border);"':''}>
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px;">
            <div><strong>${s.startTime}–${s.endTime}</strong> — ${escapeHtml(s.className)} ${categoryBadge(s.category)}
              <span class="subtle">(${presentCount} παρόντες${justifiedCount?`, ${justifiedCount} δικαιολ. απουσία`:''}${unjustifiedCount?`, ${unjustifiedCount} αδικαιολ. απουσία`:''} / ${rows.length})</span>
            </div>
            ${enrolled.length===0 ? '' :
              `<button class="btn ${allMarked?'secondary':''} small" onclick="markClassPresent('${s.seriesId}')" ${allMarked?'disabled':''}>✓ Σήμανση Υπολοίπων ως Παρόντες</button>`}
          </div>
          ${rows.length===0 ? '<div class="subtle">Κανείς δεν έχει κλείσει θέση.</div>' :
            rows.map(r=>`
              <div class="roster-row">
                <div>
                  <div>${escapeHtml(r.m.name)}${r.extra ? ' <span class="badge warn" title="Έχει καταγραφή παρουσίας αλλά δεν είναι πλέον στη λίστα αυτού του μαθήματος. Πατήστε την ενεργή κατάσταση για να διαγραφεί η καταγραφή.">εκτός λίστας</span>' : ''}</div>
                  ${r.note?`<div class="note-chip" onclick="openAttendanceNoteModal('${r.m.id}','${s.seriesId}')" title="Επεξεργασία σημείωσης">💬 ${escapeHtml(r.note)}</div>`:''}
                </div>
                <div class="status-seg">
                  <button class="${r.status==='present'?'sel-ok':''}" onclick="setClassStatus('${r.m.id}','${s.seriesId}','present')">${STATUS_META.present.short}</button>
                  <button class="${r.status==='justified'?'sel-warn':''}" onclick="setClassStatus('${r.m.id}','${s.seriesId}','justified')">${STATUS_META.justified.short}</button>
                  <button class="${r.status==='unjustified'?'sel-danger':''}" onclick="setClassStatus('${r.m.id}','${s.seriesId}','unjustified')">${STATUS_META.unjustified.short}</button>
                  <button class="icon-btn" style="padding:5px 7px;font-size:13px;${r.status===null?'opacity:.35;':''}" onclick="openAttendanceNoteModal('${r.m.id}','${s.seriesId}')" title="${r.status===null?'Ορίστε πρώτα κατάσταση παρουσίας':'Προσθήκη/επεξεργασία σημείωσης'}">📝</button>
                </div>
              </div>
            `).join('')}
        </div>`;
      }).join('')}

function setClassStatus(memberId, slotId, status){
  const existing = attendanceRecordFor(memberId, attendanceDate, slotId);
  if(existing && recordStatus(existing) === status){
    data.attendance = data.attendance.filter(a=>a!==existing); // clicking the active status again clears it
  } else if(existing){
    existing.status = status;
  } else {
    /* Category is stamped on the record at creation so later slot/override
       edits or deletions can't retroactively change what this visit consumed. */
    data.attendance.push({id: uid(), memberId, date: attendanceDate, slotId, status, category: occurrenceCategoryOn(slotId, attendanceDate)});
  }
  saveData();
  render();
}
function markClassPresent(slotId){
  /* Only fills in members with NO status set yet — never overwrites an
     already-recorded justified/unjustified absence or an existing present mark. */
  const s = data.schedule.find(x=>x.id===slotId);
  if(!s) return;
  const category = occurrenceCategoryOn(slotId, attendanceDate) || CLASS_CATEGORIES[0];
  /* The occurrence's EFFECTIVE roster for this date — per-date membership
     overrides included — not the series' base list. */
  const occ = occurrenceForSeriesOnDate(s, attendanceDate);
  (occ ? occ.memberIds : s.memberIds).forEach(mid=>{
    /* Only real members — a roster id with no member record (stale data)
       must not turn into a ghost attendance record. */
    if(!data.members.some(m => m.id === mid)) return;
    if(!attendanceRecordFor(mid, attendanceDate, slotId)){
      data.attendance.push({id: uid(), memberId: mid, date: attendanceDate, slotId, status: 'present', category});
    }
  });
  saveData();
  render();
}

/* Renders a list of {month, category, count, amount, classes} rows as a
   table grouped by month first (one bold subtotal header row per month),
   then broken down by category underneath — instead of repeating the same
   month text on every row, which got noisy once there was more than one
   category per month. */
function renderMonthGroupedTable(rows, emptyMessage){
  if(rows.length===0) return `<div class="empty">${emptyMessage}</div>`;
  const byMonth = {};
  rows.forEach(r => { (byMonth[r.month] = byMonth[r.month] || []).push(r); });
  const months = Object.keys(byMonth).sort((a,b) => b.localeCompare(a));
  return `<div class="table-scroll"><table>
    <thead><tr><th>Κατηγορία</th><th>Πληρωμές</th><th>Σύνολο Ποσού</th><th>Μαθήματα</th></tr></thead>
    <tbody>
      ${months.map(month => {
        const catRows = byMonth[month].slice().sort((a,b) => a.category.localeCompare(b.category, 'el'));
        const totalCount = catRows.reduce((s,r) => s + r.count, 0);
        const totalAmount = catRows.reduce((s,r) => s + r.amount, 0);
        const totalClasses = catRows.reduce((s,r) => s + r.classes, 0);
        return `
          <tr class="month-group-row"><td colspan="4">${monthLabel(month)} — Σύνολο: €${totalAmount.toFixed(2)} (${totalCount} πληρωμ${totalCount===1?'ή':'ές'}, ${totalClasses} μαθήματα)</td></tr>
          ${catRows.map(r => `<tr>
            <td class="indent">${categoryBadge(r.category)}</td>
            <td>${r.count}</td>
            <td>€${r.amount.toFixed(2)}</td>
            <td>${r.classes}</td>
          </tr>`).join('')}
        `;
      }).join('')}
    </tbody>
  </table></div>`;
}

/* A payment tagged as "απόδειξη" (receipt) marks that a receipt was issued
   for it. Payments saved before this feature existed have no `receipt`
   field — strictly checking === true keeps them untagged rather than
   guessing, since there's no way to know if a receipt was actually issued. */
function isReceipt(p){ return p.receipt === true; }
function togglePaymentReceipt(id){
  const p = data.payments.find(x=>x.id===id);
  if(!p) return;
  p.receipt = !isReceipt(p);
  saveData();
  render();
}
/* Grouped the same way as paymentsByValidMonth() (by the month the package
   actually became active/used, not the month it was paid) but restricted to
   receipt-tagged payments — this is the view used to check "which payments
   have I issued a receipt for". A tagged payment with no valid month yet
   (pending behind an older package, or paid but not yet used) is reported
   as a separate count instead of guessed into a month. */
function receiptsByMonth(){
  const groups = {};
  let pendingCount = 0, pendingAmount = 0;
  let unusedCount = 0, unusedAmount = 0;
  data.payments.filter(isReceipt).forEach(p => {
    const cat = p.category || CLASS_CATEGORIES[0];
    const info = paymentEffectiveInfo(p);
    if(info.state === 'pending'){
      pendingCount++; pendingAmount += Number(p.amount);
      return;
    }
    if(info.state === 'unused'){
      unusedCount++; unusedAmount += Number(p.amount);
      return;
    }
    const month = info.date.slice(0,7);
    const key = month + '|' + cat;
    if(!groups[key]) groups[key] = { month, category: cat, count: 0, amount: 0, classes: 0 };
    groups[key].count++;
    groups[key].amount += Number(p.amount);
    groups[key].classes += Number(p.classes || 0);
  });
  const rows = Object.values(groups).sort((a,b) => b.month.localeCompare(a.month) || a.category.localeCompare(b.category));
  return { rows, pendingCount, pendingAmount, unusedCount, unusedAmount };
}
function renderReceiptsCard(){
  const tagged = data.payments.filter(isReceipt);
  const totalAmount = tagged.reduce((s,p)=> s + Number(p.amount), 0);
  const { rows, pendingCount, pendingAmount, unusedCount, unusedAmount } = receiptsByMonth();
  return `
    <div class="card">
      <div class="section-title">Αποδείξεις (${tagged.length} · €${totalAmount.toFixed(2)})</div>
      <div class="subtle" style="margin-bottom:8px;">Πληρωμές που έχουν επισημανθεί ως απόδειξη, ομαδοποιημένες στον μήνα που πραγματικά άρχισαν να ισχύουν (όχι στον μήνα πληρωμής).</div>
      ${renderMonthGroupedTable(rows, 'Καμία πληρωμή δεν έχει επισημανθεί ως απόδειξη ακόμα.')}
      ${unusedCount>0 ? `<div class="subtle" style="margin-top:10px;">+ ${unusedCount} απόδειξ${unusedCount===1?'η':'εις'} (€${unusedAmount.toFixed(2)}) ${unusedCount===1?'έχει':'έχουν'} πληρωθεί αλλά δεν έχει καταγραφεί ακόμα καμία παρουσία από αυτή.</div>` : ''}
      ${pendingCount>0 ? `<div class="subtle" style="margin-top:6px;">+ ${pendingCount} απόδειξ${pendingCount===1?'η':'εις'} (€${pendingAmount.toFixed(2)}) ${pendingCount===1?'περιμένει':'περιμένουν'} να εξαντληθεί ένα προηγούμενο πακέτο πριν ενεργοποιηθ${pendingCount===1?'εί':'ούν'}.</div>` : ''}

}

function savePayment(){

  if(!data.members.some(m => m.id === memberId)){ alert('Αυτό το μέλος δεν υπάρχει πια.'); return; }

  if(!amount || !isFinite(amount) || amount <= 0){ alert('Παρακαλώ εισάγετε ένα έγκυρο ποσό.'); return; }
  const classes = Math.floor(Number(document.getElementById('f-classes').value));
  if(!classes || !isFinite(classes) || classes <= 0){ alert('Παρακαλώ εισάγετε έγκυρο αριθμό μαθημάτων.'); return; }
  const method = document.getElementById('f-method').value;

/* ---------------- Weekly Notes ---------------- */
function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  return localDateStr(d);
}
function addDaysLocalStr(dateStr, delta){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return localDateStr(d);
}
/* Session-only UI state: which weeks the user has manually expanded/collapsed,
   overriding the default (current week + any unreviewed week start expanded;
   already-reviewed past weeks start collapsed). This is what keeps the Notes
   page navigable once dozens/hundreds of weeks pile up — collapsed weeks are
   just a one-line header, and past weeks scroll in their own capped box
   instead of pushing the page taller forever. */
let weekExpandOverride = {};
function isWeekExpanded(wk, isCurrent, reviewed){
  if(wk in weekExpandOverride) return weekExpandOverride[wk];
  return isCurrent || !reviewed;
}
function toggleWeekExpanded(wk, isCurrent, reviewed){
  weekExpandOverride[wk] = !isWeekExpanded(wk, isCurrent, reviewed);
  render();
}
/* A recurring note has no separate record per week — it's the same note
   shown again in every week's card from its origin weekKey onward (its own
   origin week already gets it via the plain weekKey grouping, so only
   STRICTLY earlier recurring notes need to be added in here to avoid
   listing it twice in its own origin week). */
function notesForWeek(wk, grouped){
  const own = grouped[wk] || [];
  const recurringFromEarlier = data.notes.filter(n => n.recurring && n.weekKey < wk);
  return own.concat(recurringFromEarlier);
}
/* The classes that exist "now": one entry per class, represented by the
   segment active today (or the earliest upcoming one). Segments that already
   ended — left behind by "this and following" splits — are history and would
   otherwise list the same class once per split. */
function currentClassSeries(){
  const today = todayStr();
  const seen = {};
  return data.schedule
    .filter(s => !s.validUntil || s.validUntil >= today)
    .sort((a,b) => (a.validFrom||'') < (b.validFrom||'') ? -1 : 1)
    .filter(s => {
      const k = [s.day, s.startTime, s.endTime, s.className, s.category].join('|');
      if(seen[k]) return false;
      seen[k] = true;
      return true;
    })
    .sort((a,b)=> DAYS.indexOf(a.day)-DAYS.indexOf(b.day) || a.startTime.localeCompare(b.startTime));
}
/* Label for one schedule series as used in the note's class picker and badge —
   day/time included since the same class name can recur on several days. */
function scheduleSeriesLabel(s){
  return `${escapeHtml(s.className)} · ${DAY_SHORT[s.day]} ${s.startTime}–${s.endTime}`;
}
function noteMemberBadge(n){
  if(!n.memberId) return '';
  return `<span class="badge muted">👤 ${escapeHtml(memberName(n.memberId))}</span>`;
}
function noteClassBadge(n){
  if(!n.classId) return '';
  const s = data.schedule.find(x => x.id === n.classId);
  return s
    ? `<span class="badge muted" style="color:${classNameColor(s.className)};">🏷️ ${scheduleSeriesLabel(s)}</span>`
    : `<span class="badge muted">🏷️ (διαγραμμένο μάθημα)</span>`;
}
/* A note is reviewed independently per week it appears in — see the
   reviewedNotes comment in normalizeData(). A recurring note thus needs a
   fresh checkmark every week; a one-time note only ever has one. */
function noteReviewKey(noteId, wk){ return noteId + '__' + wk; }
function isNoteReviewed(noteId, wk){ return derived().reviewedSet.has(noteReviewKey(noteId, wk)); }
function renderNoteWeekCard(wk, notes, isCurrent){
  const weekEnd = addDaysLocalStr(wk, 6);
  const allReviewed = notes.length > 0 && notes.every(n => isNoteReviewed(n.id, wk));
  const expanded = isWeekExpanded(wk, isCurrent, allReviewed);
  return `
    <div class="card note-card${isCurrent?' week-current':''}">
      <div class="toolbar">
        <div class="section-title" style="margin:0;cursor:pointer;" onclick="toggleWeekExpanded('${wk}', ${isCurrent}, ${allReviewed})">
          ${expanded ? '▾' : '▸'} ${isCurrent ? '📌 Τρέχουσα Εβδομάδα' : 'Εβδομάδα'} (${formatDate(wk)} – ${formatDate(weekEnd)})
          <span class="badge muted">${notes.length} σημείωσ${notes.length===1?'η':'εις'}</span>
        </div>
        ${notes.length===0 ? '' : `<button class="btn ${allReviewed ? 'secondary' : ''} small" onclick="toggleAllNotesReviewed('${wk}', [${notes.map(n=>`'${n.id}'`).join(',')}])">${allReviewed ? '✓ Όλες Ελεγμένες' : 'Σήμανση Όλων ως Ελεγμένων'}</button>`}
      </div>
      ${!expanded ? '' :
        notes.length===0 ? '<div class="empty">Καμία σημείωση αυτή την εβδομάδα.</div>' :
        notes.map(n => { const nReviewed = isNoteReviewed(n.id, wk); return `<div class="note-entry${nReviewed?' reviewed':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;">
              <input type="checkbox" ${nReviewed?'checked':''} onchange="toggleNoteReviewed('${n.id}','${wk}')" title="Σήμανση ως ελεγμένη">
              <span class="subtle">${formatDate(n.date)}</span>
            </label>
            <span style="display:flex;gap:2px;">
              <button class="icon-btn" style="${n.recurring?'color:var(--primary);':'opacity:.4;'}" onclick="toggleNoteRecurring('${n.id}')" title="${n.recurring?'Επαναλαμβανόμενη — πατήστε για απενεργοποίηση (η σημείωση παραμένει)':'Μόνο αυτή την εβδομάδα — πατήστε για να γίνει επαναλαμβανόμενη'}">🔁</button>
              <button class="icon-btn" onclick="deleteNote('${n.id}')" title="Διαγραφή">✕</button>
            </span>
          </div>
          <div style="margin-top:4px;${nReviewed?'opacity:.55;':''}">${escapeHtml(n.text)}</div>
          ${(n.memberId || n.classId) ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;">${noteMemberBadge(n)}${noteClassBadge(n)}</div>` : ''}
        </div>`; }).join('')}

/* Every Monday from startWk to endWk (inclusive), both already weekKeys. */
function weeksBetween(startWk, endWk){
  const weeks = [];
  for(let wk = startWk; wk <= endWk; wk = addDaysLocalStr(wk, 7)) weeks.push(wk);
  return weeks;
}
function renderNotes(){
  const currentWeekKey = mondayOf(todayStr());
  const grouped = {};
  data.notes.forEach(n => { (grouped[n.weekKey] = grouped[n.weekKey] || []).push(n); });
  if(!grouped[currentWeekKey]) grouped[currentWeekKey] = [];
  /* A recurring note must get its own card (and reviewed-checkbox) in EVERY
     week it's active in — not just weeks that happen to also have their own
     notes — otherwise it silently vanishes from in-between weeks with
     nothing else written, even though it's supposed to recur every week. */
  data.notes.filter(n => n.recurring).forEach(n => {
    weeksBetween(n.weekKey, currentWeekKey).forEach(wk => { if(!grouped[wk]) grouped[wk] = []; });
  });
  const weekKeys = Object.keys(grouped).sort((a,b) => a < b ? 1 : -1);
  const pastWeekKeys = weekKeys.filter(wk => wk !== currentWeekKey);

  return `

/* Purely visual: highlights whichever scope option's radio is selected. Done
   as a targeted class toggle (not a full render()) so typing in the note
   textarea above isn't interrupted/cleared by a rebuild on every click. */
function updateScopeSeg(radio){
  const container = radio.closest('.scope-seg');
  if(!container) return;

/* The new-note form lives inside #content, which every render() rebuilds —

/* Turns recurrence on/off without touching the note's text or history — it
   stays exactly where it was written (its origin week); only whether it keeps
   getting carried into later weeks changes. */
function toggleNoteRecurring(id){

function toggleNoteReviewed(noteId, wk){
  const key = noteReviewKey(noteId, wk);
  if(data.reviewedNotes.includes(key)) data.reviewedNotes = data.reviewedNotes.filter(k => k !== key);
  else data.reviewedNotes.push(key);

function toggleAllNotesReviewed(wk, noteIds){
  const allReviewed = noteIds.every(id => isNoteReviewed(id, wk));
  noteIds.forEach(id => {
    const key = noteReviewKey(id, wk);
    const has = data.reviewedNotes.includes(key);
    if(allReviewed && has) data.reviewedNotes = data.reviewedNotes.filter(k => k !== key);
    if(!allReviewed && !has) data.reviewedNotes.push(key);
  });

  render();
}

/* Best-effort Saturday reminder. This can ONLY fire while the app happens to
   be open in a browser tab — a static local file has no server or background
   process, so it cannot wake up your computer or phone on its own. Opening
   the app on (or any time after) a Saturday with unreviewed notes for that
   week shows this banner; if the browser also grants Notification permission,
   a real desktop notification is fired too, once per week per session. */
let desktopNotifShownForWeek = null;
/* Which single due week the person dismissed the banner for (this session).
   The banner comes back only if a NEW week becomes due — not on every render. */
let dismissedReminderKey = null;
/* Every (note, week) occurrence up through the current week — a one-time
   note contributes just its own weekKey, a recurring note one per week from
   its origin through now (mirrors the carryover in renderNotes()). Each
   occurrence is reviewed independently, so this is what "due" is checked
   against, not the notes list itself. */
function noteOccurrences(){
  /* Memoized per data change AND per calendar day (the week list grows when
     Monday rolls over while the app is left open): checkNotesReminder() runs
     inside every render, and years of recurring notes made this the single
     most expensive thing on each keystroke. */
  const cache = derived();
  const currentWeekKey = mondayOf(todayStr());
  if(cache.noteOcc && cache.noteOccWeek === currentWeekKey) return cache.noteOcc;
  const occ = [];
  data.notes.forEach(n => {
    if(n.recurring) weeksBetween(n.weekKey, currentWeekKey).forEach(wk => occ.push({ id: n.id, weekKey: wk }));
    else occ.push({ id: n.id, weekKey: n.weekKey });
  });
  cache.noteOcc = occ;
  cache.noteOccWeek = currentWeekKey;
  return occ;
}
/* Due weeks are surfaced one at a time (oldest first), not batched into a
   single "N weeks" message — the person reviews/dismisses one week's notes,
   then the next due week (if any) appears on the following render. */
function dueNoteWeeks(){
  const today = todayStr();
  /* A week becomes "due" once its Saturday has arrived — and it STAYS due
     until every note occurrence in it is reviewed, so opening the app on
     Sunday (or weeks later) still shows the reminder instead of it silently
     disappearing after Saturday. */
  return [...new Set(
    noteOccurrences()
      .filter(o => !isNoteReviewed(o.id, o.weekKey) && addDaysLocalStr(o.weekKey, 5) <= today)
      .map(o => o.weekKey)
  )].sort();
}
function checkNotesReminder(){
  const banner = document.getElementById('notes-reminder');
  const dueWeeks = dueNoteWeeks();
  if(dueWeeks.length === 0){ banner.style.display = 'none'; return; }
  const wk = dueWeeks[0];
  if(dismissedReminderKey === wk){ banner.style.display = 'none'; return; }
  const count = noteOccurrences().filter(o => o.weekKey === wk && !isNoteReviewed(o.id, wk)).length;
  const weekText = `την εβδομάδα ${formatDate(wk)} – ${formatDate(addDaysLocalStr(wk, 6))}`;
  document.getElementById('notes-reminder-text').textContent =
    `🔔 Έχετε ${count} σημείωσ${count===1?'η':'εις'} για ανασκόπηση από ${weekText}.`;
  banner.style.display = 'flex';
  maybeShowDesktopNotification(count, wk);
}
function dismissNotesReminder(){
  document.getElementById('notes-reminder').style.display = 'none';
  const dueWeeks = dueNoteWeeks();
  dismissedReminderKey = dueWeeks.length ? dueWeeks[0] : null;
}
function maybeShowDesktopNotification(count, weekKey){
  if(!('Notification' in window)) return;
  if(desktopNotifShownForWeek === weekKey) return; // avoid re-firing every render this session
  desktopNotifShownForWeek = weekKey;
  const fire = () => new Notification('Ανασκόπηση Σημειώσεων Εβδομάδας', {
    body: `Έχετε ${count} σημείωσ${count===1?'η':'εις'} για ανασκόπηση.`,
  });
  if(Notification.permission === 'granted') fire();
  else if(Notification.permission !== 'denied') Notification.requestPermission().then(p => { if(p === 'granted') fire(); });
}

function exportData(){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'powerhub-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function looksLikeBackup(parsed){
  if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return false;
  const keys = Object.keys(defaultData());
  const isFullExport = keys.every(k => Array.isArray(parsed[k]));
  const hasRecords = keys.some(k => Array.isArray(parsed[k]) && parsed[k].length > 0);
  return isFullExport || hasRecords;
}
function importData(){
  const input = document.getElementById('import-file');
  if(!input.files.length){ alert('Επιλέξτε πρώτα ένα αρχείο αντιγράφου ασφαλείας.'); return; }
  if(!confirm('Αυτό θα αντικαταστήσει ΟΛΑ τα τρέχοντα δεδομένα με τα περιεχόμενα του αρχείου. Συνέχεια;')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error('bad file');
      /* A backup must actually look like one: either a full export (every
         section present, even if empty) or at least one section with real
         records in it — otherwise a random JSON file that happens to carry
         an empty array under one of our key names would wipe everything. */
      if(!looksLikeBackup(parsed)) throw new Error('bad file');
      data = normalizeData(parsed);
      saveData();
      alert('Τα δεδομένα επαναφέρθηκαν με επιτυχία.');
      render();
    }catch(err){
      alert('Δεν ήταν δυνατή η ανάγνωση αυτού του αρχείου. Παρακαλώ επιλέξτε ένα έγκυρο αρχείο αντιγράφου ασφαλείας.');
    }
  };
  reader.readAsText(input.files[0]);
}
function resetAll(){
  if(!confirm('Αυτό θα διαγράψει οριστικά ΟΛΑ τα δεδομένα. Είστε σίγουρος/η;')) return;
  if(!confirm('Σίγουρα σίγουρα; Αυτό δεν μπορεί να αναιρεθεί.')) return;
  data = defaultData();
  saveData();
  render();
}

    slot('Tue','09:00','10:00','Λειτουργική Προπόνηση','Βάρη',12, ['Μαρία Παπαδοπούλου','Δημήτρης Οικονόμου','Παναγιώτης Μακρής']),
    slot('Wed','08:00','09:00','Πρωινό Βάρη','Βάρη',12, ['Γιώργος Νικολάου','Κώστας Δημητρίου','Κατερίνα Στεφανίδη']),
    slot('Wed','18:00','19:00','Pilates Mat','Πιλάτες',10, ['Ελένη Αντωνίου','Άννα Ιωάννου','Σοφία Βασιλείου']),
    slot('Thu','19:00','20:00','CrossTraining','Βάρη',15, ['Νίκος Παπαγιάννης','Παναγιώτης Μακρής','Μαρία Παπαδοπούλου']),
    slot('Fri','09:00','10:00','Pilates Reformer','Πιλάτες',8, ['Σοφία Βασιλείου','Κατερίνα Στεφανίδη']),
    slot('Sat','10:00','11:00','Σαββατιάτικο Βάρη','Βάρη',12, ['Κώστας Δημητρίου','Δημήτρης Οικονόμου','Γιώργος Νικολάου']),
  ];

  const payment = (name, ago, amount, method, classes, category) => ({
    id: uid(), memberId: byName(name).id, date: daysAgoStr(ago), amount, method, classes, category, note: '',
  });
  const payments = [
    payment('Μαρία Παπαδοπούλου', 60, 50, 'Μετρητά', 10, 'Βάρη'),
    payment('Μαρία Παπαδοπούλου', 20, 40, 'Κάρτα', 5, 'Πιλάτες'),
    payment('Γιώργος Νικολάου', 45, 50, 'Μετρητά', 10, 'Βάρη'),
    // Renewed early, while the package above still has classes left —
    // demonstrates the "Εκκρεμεί" (pending) state: queued behind an older
    // package that hasn't run out yet.
    payment('Γιώργος Νικολάου', 15, 50, 'Κάρτα', 10, 'Βάρη'),
    payment('Ελένη Αντωνίου', 80, 15, 'Μετρητά', 3, 'Βάρη'),
    payment('Ελένη Αντωνίου', 30, 60, 'Κάρτα', 10, 'Πιλάτες'),
    payment('Κώστας Δημητρίου', 50, 50, 'Τραπεζικό Έμβασμα', 10, 'Βάρη'),
    payment('Σοφία Βασιλείου', 40, 60, 'Κάρτα', 10, 'Πιλάτες'),
    // Same idea for Πιλάτες: bought again well before the first package emptied.
    payment('Σοφία Βασιλείου', 12, 30, 'Μετρητά', 5, 'Πιλάτες'),
    payment('Νίκος Παπαγιάννης', 35, 25, 'Μετρητά', 5, 'Βάρη'),
    payment('Άννα Ιωάννου', 25, 50, 'Κάρτα', 10, 'Βάρη'),
    payment('Άννα Ιωάννου', 25, 60, 'Κάρτα', 10, 'Πιλάτες'),
    payment('Δημήτρης Οικονόμου', 15, 10, 'Μετρητά', 2, 'Βάρη'),
    payment('Παναγιώτης Μακρής', 4, 50, 'Κάρτα', 10, 'Βάρη'),
    // Κατερίνα Στεφανίδη deliberately has no payments — demonstrates the "Καμία πληρωμή" state.
  ];

  // Attendance for the last two weeks, generated to match each slot's real
  // weekday so the data is internally consistent (a Monday class only ever
  // gets attendance records dated on an actual Monday), including today.
  const attendance = [];
  for(let offset = 13; offset >= 0; offset--){
    const d = new Date(); d.setDate(d.getDate() - offset);
    const dateStr = localDateStr(d);
    const dayCode = dayAbbrev(dateStr);
    schedule.filter(s => s.day === dayCode).forEach(s => {
      s.memberIds.forEach((mid, idx) => {
        const roll = (offset + idx) % 5;
        let status = null;
        if(roll === 0) status = 'unjustified';
        else if(roll === 1) status = 'justified';
        else if(roll <= 3) status = 'present';
        // roll === 4 -> leave unmarked, so not every class is fully filled in
        if(status) attendance.push({ id: uid(), memberId: mid, date: dateStr, slotId: s.id, status, category: s.category });
      });
    });
  }

  /* One employee per distinct class name, so the schedule form's trainer
     dropdown works right away and every class gets its employee color. */
  const employees = [];
  schedule.forEach(s => { if(!employees.some(e => e.name === s.className)) employees.push({ id: uid(), name: s.className, category: s.category, colorIndex: employees.length }); });

  return { members, schedule, attendance, payments, employees };
}
function loadSampleData(){
  if(!confirm('Αυτό θα αντικαταστήσει όλα τα τρέχοντα δεδομένα με δοκιμαστικά δεδομένα. Συνέχεια;')) return;
  /* Normalized like a loaded snapshot, so what's on screen now is exactly
     what a reload would show (defaults such as validFrom/flagged filled in). */
  data = normalizeData(Object.assign(defaultData(), buildSampleData()));
  saveData();
  navigate('dashboard');
}

/* ---------------- Init ---------------- */
probeStorageLimit();
checkStorageSpace();
updateSaveWarning();
render();
initDurableStore();
initFileHandle();
/* Another tab of this app saved: adopt its data instead of overwriting it on
   our next save. Every change is persisted immediately, so nothing pending
   is lost here — the modal (if open) is left alone and the page re-rendered.
   Only snapshots shaped like our own writes are adopted: anything else in
   that key (another script, a corrupted write) is ignored rather than
   normalized into an empty dataset that would wipe this tab's view. */
window.addEventListener('storage', e => {
  if(e.key !== STORAGE_KEY || e.newValue == null) return;
  let parsed;
  try{ parsed = JSON.parse(e.newValue); }catch(err){ return; }
  if(!parsed || typeof parsed !== 'object' || !Object.keys(defaultData()).every(k => Array.isArray(parsed[k]))) return;
  data = normalizeData(parsed);
  lastSavedChars = e.newValue.length;
  try{ lastSavedAt = Math.max(lastSavedAt, Number(localStorage.getItem(SAVED_AT_KEY)) || 0); }catch(err){}
  invalidateDerived();
  render();
});
</script>
